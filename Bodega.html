<style>
/* ============ Variables y temas ============ */
:root {
  --brand: #0f766e;
  --on-brand: #ffffff;
  --brand-strong: color-mix(in srgb, var(--brand) 82%, #000);
  --brand-soft: color-mix(in srgb, var(--brand) 11%, var(--surface));
  --brand-line: color-mix(in srgb, var(--brand) 30%, var(--line));

  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f9fa;
  --text: #121826;
  --muted: #667085;
  --line: #e4e8ec;
  --danger: #d92d20;
  --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--surface));
  --warn: #b54708;
  --warn-soft: color-mix(in srgb, #f79009 14%, var(--surface));
  --ok: #067647;
  --ok-soft: color-mix(in srgb, #12b76a 13%, var(--surface));

  --radius: 16px;
  --radius-sm: 11px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 28px -14px rgba(16, 24, 40, .16);
  --shadow-lg: 0 24px 60px -20px rgba(16, 24, 40, .35);
  --nav-h: 66px;
}
[data-theme="dark"] {
  --bg: #0d1215;
  --surface: #161d21;
  --surface-2: #1b2328;
  --text: #edf1f3;
  --muted: #94a3ab;
  --line: #26313a;
  --danger: #f97066;
  --warn: #fdb022;
  --ok: #47cd89;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .6);
  --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
#print-area { display: none; }

.ic { width: 20px; height: 20px; flex: none; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ============ Estructura ============ */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100dvh;
  display: flex; flex-direction: column; gap: 6px;
  padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; padding: 4px 8px 18px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; flex: none; overflow: hidden;
  display: grid; place-items: center;
  background: var(--brand); color: var(--on-brand); font-weight: 750; font-size: 18px;
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
.brand-txt { min-width: 0; display: flex; flex-direction: column; }
.brand-txt strong { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-txt small { color: var(--muted); font-size: 12px; }

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: 12px;
  color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14.5px;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-strong); }
[data-theme="dark"] .nav-item.active { color: color-mix(in srgb, var(--brand) 55%, #fff); }
.side-foot { margin-top: auto; padding: 10px 8px 0; font-size: 12.5px; color: var(--muted); }

.main-col { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
}
.topbar .brand { padding: 0; display: none; }
.spacer { flex: 1; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip-btn:hover { border-color: var(--brand-line); }
.chip-btn .ic { width: 16px; height: 16px; }
.chip-btn.ok .ic { color: var(--ok); }
.chip-btn.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip-btn.err { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip-btn.tasa b { color: var(--brand-strong); }
[data-theme="dark"] .chip-btn.tasa b { color: color-mix(in srgb, var(--brand) 55%, #fff); }

@media (max-width: 560px) {
  .chip-btn .hide-sm { display: none; }
  .chip-btn { padding: 8px 11px; }
  .topbar .brand-txt small { display: none; }
}

.view { max-width: 1180px; margin: 0 auto; padding: 8px 20px 60px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 6px 0 18px; }
.page-head h1 { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
.sub { color: var(--muted); margin-top: 2px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.bottom-nav {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding: 6px 6px env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line);
}
.bottom-nav .nav-item {
  flex: 1; flex-direction: column; justify-content: center; gap: 3px;
  padding: 6px 2px; font-size: 11.5px; border-radius: 12px;
}

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .bottom-nav { display: flex; }
  .topbar { padding: 10px 14px; }
  .topbar .brand { display: flex; }
  .view { padding: 4px 14px calc(var(--nav-h) + 40px); }
  .page-head h1 { font-size: 23px; }
}

/* ============ Botones y formularios ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; min-height: 42px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 14.5px;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { border-color: var(--brand-line); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 85%, #000); border-color: transparent; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-soft { background: var(--brand-soft); border-color: transparent; color: var(--brand-strong); }
[data-theme="dark"] .btn-soft { color: color-mix(in srgb, var(--brand) 55%, #fff); }
.btn-sm { min-height: 34px; padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.btn-lg { min-height: 52px; font-size: 16px; border-radius: 14px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 11px;
  border: 1px solid transparent; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.link { background: none; border: 0; padding: 0; color: var(--brand-strong); font-weight: 600; font-size: 13.5px; }
[data-theme="dark"] .link { color: color-mix(in srgb, var(--brand) 55%, #fff); }
.link:hover { text-decoration: underline; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 650; color: var(--muted); letter-spacing: .01em; }
.input, .select {
  width: 100%; min-height: 44px; padding: 10px 13px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
  font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
}
.input:focus, .select:focus {
  border-color: var(--brand); background: var(--surface);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent);
}
.input:disabled, .select:disabled { opacity: .6; }
.hint { font-size: 12.5px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row.three { grid-template-columns: repeat(3, 1fr); }
.form { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 520px) { .field-row.three { grid-template-columns: 1fr 1fr; } }

.search {
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 46px;
}
.search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
.search .ic { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 11px 0; }

.seg { display: inline-flex; padding: 4px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px; }
.seg button {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 10px;
  font-weight: 650; font-size: 13.5px; color: var(--muted);
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(16, 24, 40, .12); }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-f {
  flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--muted);
}
.chip-f.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.chip-f .n { opacity: .75; margin-left: 4px; font-weight: 500; }

.switch-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; font-weight: 600; }
.switch-line input { position: absolute; opacity: 0; pointer-events: none; }
.switch-line .sw {
  position: relative; width: 44px; height: 26px; border-radius: 999px; flex: none;
  background: var(--line); transition: background .2s;
}
.switch-line .sw::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s;
}
.switch-line input:checked + .sw { background: var(--brand); }
.switch-line input:checked + .sw::after { transform: translateX(18px); }
.switch-line input:focus-visible + .sw { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 25%, transparent); }

.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge.low { background: var(--warn-soft); color: var(--warn); }
.badge.out { background: var(--danger-soft); color: var(--danger); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.void { background: var(--danger-soft); color: var(--danger); }

/* ============ Tarjetas ============ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.card h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.grid { display: grid; gap: 16px; }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 760px) { .grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.grid.main-side { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
.grid > .card + .card { margin-top: 0; }
@media (max-width: 1000px) { .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.main-side { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .grid.cols-2 { grid-template-columns: minmax(0, 1fr); } .card { padding: 15px; } }

.stat { display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.stat .lab { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stat .lab .ic { width: 17px; height: 17px; }
.stat .val { font-size: 27px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; }
.stat .sec { font-size: 13px; color: var(--muted); }
.stat.accent { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.stat.accent .lab, .stat.accent .sec { color: color-mix(in srgb, var(--on-brand) 78%, transparent); }
@media (max-width: 640px) { .stat .val { font-size: 22px; } }

.banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 13px 16px; border-radius: 14px; margin-bottom: 16px;
  background: var(--warn-soft); color: var(--warn); font-weight: 600;
}
.banner .btn { margin-left: auto; }

.empty { text-align: center; padding: 42px 18px; color: var(--muted); }
.empty .ic { width: 38px; height: 38px; opacity: .45; margin-bottom: 10px; }
.empty h4 { font-size: 16px; color: var(--text); margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* ============ Inventario ============ */
.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.prod {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 15px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
}
.prod-top { display: flex; gap: 12px; align-items: center; }
.avatar {
  --h: 180;
  width: 44px; height: 44px; border-radius: 13px; flex: none; display: grid; place-items: center;
  font-weight: 750; font-size: 18px;
  background: hsl(var(--h) 55% 91%); color: hsl(var(--h) 55% 28%);
}
[data-theme="dark"] .avatar { background: hsl(var(--h) 30% 22%); color: hsl(var(--h) 60% 80%); }
.prod-name { min-width: 0; flex: 1; }
.prod-name h4 { font-size: 15.5px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.prod-name .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.prod-mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.price b { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.price small { display: block; color: var(--muted); font-size: 12.5px; }
.stock { text-align: right; }
.stock b { font-size: 19px; font-weight: 750; }
.stock small { display: block; color: var(--muted); font-size: 12.5px; }
.stock.low b { color: var(--warn); }
.stock.out b { color: var(--danger); }
.meter { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.meter.low i { background: #f79009; }
.meter.out i { background: var(--danger); }
.prod-actions { display: flex; gap: 6px; padding-top: 2px; }
.prod-actions .btn { flex: 1; }

/* ============ Punto de venta ============ */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.pos-cart { position: sticky; top: 68px; max-height: calc(100dvh - 90px); overflow: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile {
  text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 112px;
  padding: 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow); transition: border-color .15s, transform .05s;
}
.tile:hover { border-color: var(--brand-line); }
.tile:active { transform: scale(.98); }
.tile.out { opacity: .5; pointer-events: none; }
.tile .t-name { font-weight: 700; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
.tile .t-pres { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tile .t-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; }
.tile .t-price { font-weight: 750; font-size: 16px; }
.tile .t-price small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.tile .t-stock { font-size: 12px; color: var(--muted); text-align: right; }
.tile .t-stock.low { color: var(--warn); font-weight: 650; }

.pos-switch { display: none; margin-bottom: 12px; }
.pos-switch .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 4px; border-radius: 99px; background: var(--brand); color: var(--on-brand); font-size: 11.5px; }
.cart-bar {
  display: none; position: fixed; z-index: 25; left: 12px; right: 12px;
  bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));
  align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px; border-radius: 16px; border: 0;
  background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-lg);
}
.cart-bar b { font-size: 17px; }
.cart-bar small { display: block; opacity: .85; }
.cart-bar .btn { background: rgba(255, 255, 255, .18); border-color: transparent; color: inherit; }

@media (max-width: 899px) {
  .pos { grid-template-columns: minmax(0, 1fr); }
  .pos-switch { display: flex; }
  .pos[data-pane="productos"] .pos-cart { display: none; }
  .pos[data-pane="carrito"] .pos-catalog { display: none; }
  .pos-cart { position: static; max-height: none; }
  .cart-bar.show { display: flex; }
}

.cart-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.cart-item:last-child { border-bottom: 0; }
.ci-name { font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.ci-sub { color: var(--muted); font-size: 12.5px; }
.ci-price { text-align: right; font-weight: 700; }
.ci-price small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.ci-ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.stepper button { width: 36px; height: 34px; border: 0; background: var(--surface-2); display: grid; place-items: center; }
.stepper button:hover { background: var(--brand-soft); }
.stepper .q { min-width: 70px; text-align: center; font-weight: 700; padding: 0 8px; background: var(--surface); border: 0; height: 34px; }
.cart-opts { margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.totals { margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
.totals .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.totals .row b { color: var(--text); font-weight: 650; }
.totals .grand { margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: baseline; }
.totals .grand span { font-weight: 650; color: var(--muted); }
.totals .grand strong { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.totals .grand.bs strong { color: var(--brand-strong); }
[data-theme="dark"] .totals .grand.bs strong { color: color-mix(in srgb, var(--brand) 55%, #fff); }
.totals .grand.vuelto strong { color: var(--ok); }
.totals .grand.vuelto.falta strong { color: var(--danger); }
.totals .tasa-note { font-size: 12px; color: var(--muted); text-align: right; }
.cart-actions { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-top: 14px; }

/* ============ Historial ============ */
.period-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.period-nav { display: flex; align-items: center; gap: 4px; }
.period-nav .label { min-width: 190px; text-align: center; font-weight: 700; }
.period-nav input[type=date] { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: calc(var(--bh, 140px) + 38px); }
.bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.bar-val { font-size: 11px; color: var(--muted); height: 14px; white-space: nowrap; }
.bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bar-fill { width: min(100%, 36px); border-radius: 8px 8px 3px 3px; background: color-mix(in srgb, var(--brand) 38%, var(--surface-2)); min-height: 0; transition: height .3s; }
.bar-fill.hl { background: var(--brand); }
.bar-lab { font-size: 11.5px; color: var(--muted); height: 14px; white-space: nowrap; }

.sale { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 10px; overflow: hidden; }
.sale summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 15px; }
.sale summary::-webkit-details-marker { display: none; }
.sale[open] summary { background: var(--surface-2); }
.sale .s-l b, .sale .s-r b { font-weight: 700; }
.sale .s-l small, .sale .s-r small { display: block; color: var(--muted); font-size: 12.5px; }
.sale .s-r { text-align: right; }
.sale.void { opacity: .65; }
.sale.void .s-r b { text-decoration: line-through; }
.sale-body { padding: 4px 15px 15px; border-top: 1px solid var(--line); }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
.line:last-of-type { border-bottom: 0; }
.line small { color: var(--muted); display: block; }
.sale-sum { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.sale-sum div { display: flex; justify-content: space-between; padding: 2px 0; }
.sale-sum .t { color: var(--text); font-weight: 750; font-size: 16px; padding-top: 6px; }
.sale-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.rank { display: flex; flex-direction: column; gap: 12px; }
.rank-row .rk-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.rank-row .rk-top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .meter { margin-top: 6px; }
.mov { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.mov:last-child { border-bottom: 0; }
.mov .m-main { flex: 1; min-width: 0; }
.mov .m-main b { display: block; font-weight: 650; overflow-wrap: anywhere; }
.mov .m-main small { color: var(--muted); }
.mov .m-q { font-weight: 750; white-space: nowrap; }
.mov .m-q.pos { color: var(--ok); }
.mov .m-q.neg { color: var(--danger); }

/* ============ Ajustes ============ */
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); position: relative; }
.swatch.on { box-shadow: 0 0 0 2.5px var(--text); }
.swatch.on::after { content: ""; position: absolute; inset: 0; margin: auto; width: 9px; height: 15px; border: solid #fff; border-width: 0 3px 3px 0; transform: translate(0, -1px) rotate(45deg); width: 8px; height: 14px; }
.color-custom { width: 44px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: none; cursor: pointer; }
.logo-edit { display: flex; align-items: center; gap: 14px; }
.logo-edit .brand-mark { width: 64px; height: 64px; border-radius: 16px; font-size: 26px; }
.cat-list { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
.cat-pill button { border: 0; background: transparent; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); }
.cat-pill button:hover { background: var(--danger-soft); color: var(--danger); }
.cat-pill button .ic { width: 14px; height: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--muted); }

/* ============ Modales ============ */
.modal-wrap {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(8, 12, 16, .5); opacity: 0; transition: opacity .18s;
}
.modal-wrap.open { opacity: 1; }
.modal {
  width: 100%; max-width: 480px; max-height: calc(100dvh - 32px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg);
  transform: translateY(14px) scale(.98); transition: transform .2s;
}
.modal-wrap.open .modal { transform: none; }
.modal.wide { max-width: 560px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 16px 6px 20px; }
.modal-head h3 { font-size: 18px; font-weight: 750; letter-spacing: -.01em; }
.modal-body { padding: 10px 20px 18px; overflow: auto; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.modal-foot .btn { flex: 1 1 auto; }
.muted-p { color: var(--muted); line-height: 1.5; }
.tip { padding: 11px 13px; border-radius: 12px; background: var(--brand-soft); font-size: 13.5px; color: var(--text); }
.preview-box { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.preview-box b { font-size: 18px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.ticket-wrap { display: flex; justify-content: center; padding: 6px 0 4px; background: var(--surface-2); border-radius: 14px; max-height: 58dvh; overflow: auto; }
.ticket-img { width: min(100%, 330px); height: auto; box-shadow: 0 4px 18px rgba(0, 0, 0, .18); background: #fff; margin: 8px 0; }
.btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.btn-row .btn { flex-direction: column; gap: 4px; padding: 9px 4px; font-size: 12.5px; min-height: 58px; }
.btn-row.full { grid-template-columns: 1fr; }

@media (max-width: 640px) {
  .modal-wrap { align-items: flex-end; padding: 0; }
  .modal { max-width: none; border-radius: 22px 22px 0 0; max-height: 92dvh; transform: translateY(40px); }
  .modal-head { padding-top: 18px; }
}

/* ============ Avisos ============ */
#toasts { position: fixed; z-index: 200; left: 50%; transform: translateX(-50%); top: 14px; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px;
  background: #101828; color: #fff; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg);
  animation: drop .22s ease-out; transition: opacity .25s, transform .25s;
}
.toast.err { background: var(--danger); }
.toast .ic { width: 18px; height: 18px; }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }

/* ============ Bienvenida ============ */
.welcome { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.welcome-card { width: min(100%, 460px); text-align: center; padding: 34px 26px; }
.welcome-card .brand-mark { width: 64px; height: 64px; font-size: 28px; border-radius: 18px; margin: 0 auto 18px; }
.welcome-card h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.welcome-card p { color: var(--muted); margin: 10px 0 22px; line-height: 1.55; }
.welcome-card .stack { gap: 10px; }
.welcome-card .small { font-size: 12.5px; margin: 18px 0 0; }

@media print {

  html, body { background: #fff !important; margin: 0; padding: 0; }
  #root, #toasts, .modal-wrap { display: none !important; }
  #print-area { display: block !important; }
  .print-ticket { display: block; width: 80mm; max-width: 100%; margin: 0 auto; }

}
</style>

<script>
'use strict';

/* =====================================================================
   utils.js — utilidades generales: estado global, formatos, íconos,
   ventanas modales, avisos y cálculos de dinero/inventario.
   ===================================================================== */

/* ---------- Estado global ---------- */
const S = {
  db: null,
  view: 'inicio',
  inv: { q: '', f: 'todos' },
  pos: { q: '', cat: '', cart: [], cliente: '', pago: 'Efectivo USD', descPct: 0, aplicaImp: false, pane: 'productos' },
  hist: { tab: 'ventas', per: 'dia', ref: new Date() }
};

const Actions = {};   // data-action="x"  -> click
const Inputs = {};    // data-input="x"   -> input
const Changes = {};   // data-change="x"  -> change

/* ---------- DOM ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const rq = n => Math.round(Number(n) * 1e6) / 1e6;          // redondeo de cantidades
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? NaN : n; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

/* ---------- Formatos ---------- */
function fmtNum(n, dec = 2) {                  // 1.234,56
  n = Number(n) || 0;
  const neg = n < 0; n = Math.abs(n);
  const [i, d] = n.toFixed(dec).split('.');
  const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-' : '') + g + (dec > 0 ? ',' + d : '');
}
const usd = n => '$' + fmtNum(n, 2);
const bs = n => 'Bs ' + fmtNum(n, 2);
const pagoTxt = v => v.pagoDetalle ? 'Otro: ' + v.pagoDetalle : (v.pago || '');
const fmtM = (m, n) => m === 'Bs' ? bs(n) : usd(n);
function fmtQty(n) {                           // hasta 3 decimales, sin ceros sobrantes
  let s = fmtNum(rq(n), 3);
  if (s.includes(',')) s = s.replace(/0+$/, '').replace(/,$/, '');
  return s;
}
const pad = n => String(n).padStart(2, '0');
const pad6 = n => String(n).padStart(6, '0');
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIA3 = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const fmtTime = d => { let h = d.getHours(); const ap = h >= 12 ? 'p. m.' : 'a. m.'; h = h % 12 || 12; return `${pad(h)}:${pad(d.getMinutes())} ${ap}`; };
const fmtDateTime = d => fmtDate(d) + ' ' + fmtTime(d);
const toInputDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromInputDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };

function rangoPeriodo(per, ref) {
  const d0 = startOfDay(ref); let from, to, label;
  if (per === 'dia') {
    from = d0; to = addDays(d0, 1);
    label = `${cap(DIAS[d0.getDay()])} ${d0.getDate()} de ${MESES[d0.getMonth()]} ${d0.getFullYear()}`;
  } else if (per === 'semana') {
    from = startOfWeek(d0); to = addDays(from, 7);
    const last = addDays(to, -1);
    label = `${from.getDate()} ${MES3[from.getMonth()]} – ${last.getDate()} ${MES3[last.getMonth()]} ${last.getFullYear()}`;
  } else if (per === 'mes') {
    from = new Date(d0.getFullYear(), d0.getMonth(), 1); to = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
    label = `${cap(MESES[d0.getMonth()])} ${d0.getFullYear()}`;
  } else {
    from = new Date(d0.getFullYear(), 0, 1); to = new Date(d0.getFullYear() + 1, 0, 1);
    label = String(d0.getFullYear());
  }
  return { from, to, label };
}
function shiftPeriodo(per, ref, dir) {
  const d = new Date(ref);
  if (per === 'dia') d.setDate(d.getDate() + dir);
  else if (per === 'semana') d.setDate(d.getDate() + 7 * dir);
  else if (per === 'mes') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
  else d.setFullYear(d.getFullYear() + dir);
  return d;
}
const PERIODOS = { dia: 'Día', semana: 'Semana', mes: 'Mes', ano: 'Año' };

/* ---------- Unidades ---------- */
const UNITS = {
  und: { label: 'Unidad', short: 'und', group: 'und', factor: 1 },
  kg: { label: 'Kilogramo (kg)', short: 'kg', group: 'peso', factor: 1e6 },
  g: { label: 'Gramo (g)', short: 'g', group: 'peso', factor: 1e3 },
  mg: { label: 'Miligramo (mg)', short: 'mg', group: 'peso', factor: 1 },
  l: { label: 'Litro (L)', short: 'L', group: 'vol', factor: 1e3 },
  ml: { label: 'Mililitro (ml)', short: 'ml', group: 'vol', factor: 1 }
};
const convert = (q, from, to) => rq(q * UNITS[from].factor / UNITS[to].factor);
const compatibleUnits = u => Object.keys(UNITS).filter(k => UNITS[k].group === UNITS[u].group);
const uShort = u => (UNITS[u] || UNITS.und).short;
const MIN_DEFAULT = { und: 5, kg: 5, l: 5, g: 500, ml: 500, mg: 5000 };
const nombreCompleto = p => p.nombre + (p.presentacion ? ' ' + p.presentacion : '');
const hueOf = s => { let h = 0; for (const c of String(s || 'x')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

/* ---------- Íconos (SVG en línea) ---------- */
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/>',
  chart: '<path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/>',
  settings: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  download: '<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
  upload: '<path d="M12 16V5m0 0L8 9m4-4 4 4M5 20h14"/>',
  pdf: '<path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-8 9"/>',
  print: '<path d="M7 9V3h10v6M7 17H4a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-3"/><rect x="7" y="14" width="10" height="7"/>',
  share: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',
  save: '<path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/>',
  receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  tag: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',
  folder: '<path d="M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  chevL: '<path d="m15 5-7 7 7 7"/>',
  chevR: '<path d="m9 5 7 7-7 7"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  dollar: '<path d="M12 3v18M16.5 7.5C16 6 14.5 5 12 5c-2.5 0-4 1.1-4 3s1.5 2.7 4 3.2 4 1.3 4 3.3-1.6 3.5-4 3.5c-2.5 0-4.1-1-4.5-2.5"/>',
  cash: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- Avisos ---------- */
function toast(msg, type = 'ok') {
  const c = $('#toasts'); if (!c) return;
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `${icon(type === 'err' ? 'alert' : 'check')}<span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 280); }, type === 'err' ? 3600 : 2600);
}

/* ---------- Modales ---------- */
function openModal({ title = '', html = '', footer = '', wide = false, onClose = null, onMount = null }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `
    <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-modal-close aria-label="Cerrar">${icon('x')}</button></div>
      <div class="modal-body">${html}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
    </div>`;
  document.body.appendChild(wrap);
  document.body.classList.add('no-scroll');
  requestAnimationFrame(() => wrap.classList.add('open'));
  let closed = false;
  const api = {
    el: wrap,
    body: $('.modal-body', wrap),
    close() {
      if (closed) return; closed = true;
      wrap.classList.remove('open');
      setTimeout(() => { wrap.remove(); if (!$('.modal-wrap')) document.body.classList.remove('no-scroll'); }, 190);
      if (onClose) onClose();
    }
  };
  wrap.addEventListener('mousedown', e => { wrap._down = e.target === wrap; });
  wrap.addEventListener('click', e => {
    if ((e.target === wrap && wrap._down) || e.target.closest('[data-modal-close]')) api.close();
  });
  const first = $('[autofocus]', wrap) || null;
  if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);
  if (onMount) onMount(api);
  return api;
}
const closeTopModal = () => { const all = $$('.modal-wrap'); const m = all[all.length - 1]; if (m) $('[data-modal-close]', m).click(); };

function confirmDialog({ title = '¿Confirmar?', msg = '', ok = 'Aceptar', cancel = 'Cancelar', danger = false }) {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title, html: `<p class="muted-p">${msg}</p>`,
      footer: `<button class="btn" data-modal-close>${esc(cancel)}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-confirm-ok>${esc(ok)}</button>`,
      onClose: () => { if (!done) { done = true; res(false); } }
    });
    $('[data-confirm-ok]', m.el).addEventListener('click', () => { done = true; res(true); m.close(); });
  });
}

/* ---------- Descargas ---------- */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function shareOrDownload(blob, name, title) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  downloadBlob(blob, name);
  toast('Archivo guardado en Descargas');
}
function csvDownload(nombre, filas) {
  const txt = '\ufeff' + filas.map(r => r.map(c => {
    c = String(c ?? '');
    return /[;"\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
  }).join(';')).join('\r\n');
  downloadBlob(new Blob([txt], { type: 'text/csv;charset=utf-8' }), nombre);
}
const numES = n => String(Number(n)).replace('.', ',');

/* ---------- Cálculos de dinero e inventario ---------- */
const Calc = {
  hasTasa: () => Number(S.db.config.tasa) > 0,
  toBs: (u, t) => round2(u * (t ?? S.db.config.tasa)),
  totales(items, descPct, impPct) {
    const subtotal = round2(items.reduce((s, i) => s + i.subtotal, 0));
    const descuento = round2(subtotal * (descPct || 0) / 100);
    const base = subtotal - descuento;
    const impuesto = round2(base * (impPct || 0) / 100);
    return { subtotal, descuento, impuesto, total: round2(base + impuesto) };
  },
  minimo: p => (p.minimo ?? S.db.config.stockMinimo),
  margen: p => (p.costo > 0 ? (p.precio / p.costo - 1) * 100 : null),   // % de ganancia sobre el costo
  agotado: p => p.stock <= 0,
  stockBajo: p => p.stock > 0 && p.stock < Calc.minimo(p),
  validas: () => S.db.ventas.filter(v => !v.anulada),
  enRango(from, to) {
    return Calc.validas().filter(v => { const d = new Date(v.fecha); return d >= from && d < to; });
  },
  sum: (arr, k) => round2(arr.reduce((s, x) => s + (Number(x[k]) || 0), 0)),
  prod: id => S.db.productos.find(p => p.id === id)
};

/* ---------- Gráfico de barras sencillo ---------- */
function barChart(data, { height = 130 } = {}) {
  const max = Math.max(...data.map(d => d.value), 0.0001);
  const every = data.length > 14 ? 5 : 1;
  return `<div class="bars" style="--bh:${height}px">${data.map((d, i) => {
    const pct = d.value > 0 ? Math.max(d.value / max * 100, 4) : 0;
    const showVal = data.length <= 8 && d.value > 0;
    const lab = (i % every === 0 || i === data.length - 1) ? esc(d.label) : '';
    return `<div class="bar-col" title="${esc(d.title || '')}">
      <div class="bar-val">${showVal ? '$' + fmtNum(d.value, d.value >= 100 ? 0 : 2) : ''}</div>
      <div class="bar-track"><div class="bar-fill ${d.hl ? 'hl' : ''}" style="height:${pct}%"></div></div>
      <div class="bar-lab">${lab}</div></div>`;
  }).join('')}</div>`;
}

/* ---------- Delegación global de eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t || t.disabled) return;
  const fn = Actions[t.dataset.action];
  if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const t = e.target.closest('[data-input]');
  if (!t) return;
  const fn = Inputs[t.dataset.input];
  if (fn) fn(t, e);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]');
  if (!t) return;
  const fn = Changes[t.dataset.change];
  if (fn) fn(t, e);
});
document.addEventListener('keydown', e => {

/* =====================================================================
   storage.js — Persistencia de la base de datos.

   MODO ARCHIVO (Chrome / Edge en PC): el sistema abre un archivo .json
   real del equipo y lo sobrescribe después de cada cambio. No depende
   del caché del navegador.

   MODO COMPATIBLE (teléfonos, Safari, Firefox): los navegadores no dejan
   sobrescribir un archivo solos, así que se guarda una copia interna y el
   usuario guarda el archivo .json con el botón "Guardar respaldo"
   (queda en Descargas / Documentos) y lo vuelve a abrir cuando quiera.
   ===================================================================== */

function defaultDB() {
  return {
    app: 'bodega-pos',
    version: 1,
    creado: new Date().toISOString(),
    config: {
      negocio: 'Mi Bodega', rif: '', telefono: '', direccion: '', logo: '',
      color: '#0f766e', tema: 'auto',
      tasa: 0, tasaFecha: '',
      impuestoActivo: false, impuestoNombre: 'IVA', impuestoPct: 16, impuestoPorDefecto: false,
      stockMinimo: 5,
      vueltoActivo: false,
      mostrarValorInventario: true,
      costoActivo: false, margenDefecto: 30,
      pie: '¡Gracias por su compra!',
      ticketTitulo: 'TICKET DE VENTA',
      ultimoRespaldo: ''
    },
    categorias: ['Frutas y verduras', 'Carnes', 'Lácteos', 'Víveres', 'Bebidas', 'Limpieza', 'Otros'],
    productos: [],
    ventas: [],
    movimientos: [],
    contadorVentas: 0
  };
}

function normalizeDB(d) {
  const base = defaultDB();
  if (!d || typeof d !== 'object') return base;
  const out = { ...base, ...d };
  out.config = { ...base.config, ...(d.config || {}) };
  ['categorias', 'productos', 'ventas', 'movimientos'].forEach(k => { if (!Array.isArray(out[k])) out[k] = base[k]; });
  if (!out.contadorVentas) out.contadorVentas = out.ventas.length;
  return out;
}

const Storage = (() => {
  const STORE = 'kv';
  const FILE_TYPES = [{ description: 'Datos de la bodega (.json)', accept: { 'application/json': ['.json'] } }];
  const supportsFile = typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';
  let handle = null;
  let mode = supportsFile ? 'file' : 'compat';
  let status = 'idle';            // idle | saving | saved | error
  let timer = null, writing = false, pending = false;
  const listeners = [];

  /* --- IndexedDB mínima (guarda el "puntero" al archivo y una copia interna) --- */
  const idb = () => new Promise((res, rej) => {
    const r = indexedDB.open('bodega-sistema', 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function kvGet(k) {
    try {
      const d = await idb();
      return await new Promise((res, rej) => { const q = d.transaction(STORE).objectStore(STORE).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch (e) { return undefined; }
  }
  async function kvSet(k, v) {
    try {
      const d = await idb();
      await new Promise((res, rej) => { const t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
    } catch (e) { /* sin IndexedDB: se ignora */ }
  }

  const setStatus = s => { status = s; listeners.forEach(f => f(s)); };

  async function readHandle(h) {
    const file = await h.getFile();
    const text = await file.text();
    if (!text.trim()) return defaultDB();
    return normalizeDB(JSON.parse(text));
  }
  async function writeHandle() {
    const w = await handle.createWritable();
    await w.write(JSON.stringify(S.db, null, 2));
    await w.close();
  }

  async function flush() {
    if (writing) { pending = true; return; }
    writing = true;
    try {
      await kvSet('db', S.db);                      // copia interna de seguridad
      if (handle && mode === 'file') await writeHandle();
      setStatus('saved');
    } catch (e) {
      console.error('Error al guardar', e);
      setStatus('error');
      toast('No se pudo guardar en el archivo. Revisa los permisos.', 'err');
    }
    writing = false;
    if (pending) { pending = false; flush(); }
  }

  return {
    get mode() { return mode; },
    get supportsFile() { return supportsFile; },
    get fileName() { return handle ? handle.name : ''; },
    get hasHandle() { return !!handle; },
    get status() { return status; },
    onStatus(f) { listeners.push(f); },

    /** Intenta arrancar sin interacción. Devuelve {db} o {needsAction, ...} */
    async start() {
      if (supportsFile) {
        const h = await kvGet('handle');
        if (h) {
          handle = h;
          try {
            const p = await h.queryPermission({ mode: 'readwrite' });
            if (p === 'granted') return { db: await readHandle(h) };
          } catch (e) { handle = null; }
          if (handle) return { needsAction: true, fileName: handle.name };
        }
        return { needsAction: true };
      }
      const local = await kvGet('db');
      if (local) return { db: normalizeDB(local) };
      return { needsAction: true, first: true };
    },

    async resume() {            // pedir permiso otra vez sobre el archivo recordado
      const p = await handle.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') throw new Error('permiso denegado');
      return readHandle(handle);
    },
    async openFile() {
      const [h] = await window.showOpenFilePicker({ types: FILE_TYPES, multiple: false });
      const p = await h.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') throw new Error('permiso denegado');
      handle = h; mode = 'file';
      await kvSet('handle', h);
      return readHandle(h);
    },
    async createFile() {
      const h = await window.showSaveFilePicker({ suggestedName: 'bodega.json', types: FILE_TYPES });
      handle = h; mode = 'file';
      await kvSet('handle', h);
      const db = defaultDB();
      S.db = db;
      await writeHandle();
      return db;
    },
    parseText(text) { return normalizeDB(JSON.parse(text)); },
    async useLocalOnly() {          // trabajar sin archivo (solo copia interna del navegador)
      mode = 'compat'; handle = null;
      const local = await kvGet('db');
      return local ? normalizeDB(local) : defaultDB();
    },

    save() { setStatus('saving'); clearTimeout(timer); timer = setTimeout(flush, 250); },
    async saveNow() { clearTimeout(timer); await flush(); },

    exportBackup() {
      S.db.config.ultimoRespaldo = new Date().toISOString();
      const blob = new Blob([JSON.stringify(S.db, null, 2)], { type: 'application/json' });
      downloadBlob(blob, `bodega_${toInputDate(new Date())}.json`);
      this.save();
      toast('Respaldo guardado en Descargas');
    }
  };
})();

window.addEventListener('beforeunload', e => {
  if (Storage.status === 'saving') { e.preventDefault(); e.returnValue = ''; }
});


/* =====================================================================
   reportes.js — Generación de PDF (sin librerías externas), ticket como
   imagen, impresión y exportación a Excel (CSV).
   ===================================================================== */

/* ---------- Mini generador de PDF ---------- */
const HELV = [
  278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278,
  556, 556, 556, 556, 556, 556, 556, 556, 556, 556,
  278, 278, 584, 584, 584, 556, 1015,
  667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611,
  278, 278, 278, 469, 556, 333,
  556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500,
  334, 260, 334, 584
];
function pdfTextWidth(str, size, bold) {
  let w = 0;
  for (const ch of String(str)) {
    let c = ch.charCodeAt(0);
    if (c > 126 || c < 32) { c = (ch.normalize('NFD')[0] || '?').charCodeAt(0); if (c > 126 || c < 32) c = 110; }
    let cw = HELV[c - 32] || 556;
    if (bold && !(c >= 48 && c <= 57)) cw *= 1.07;
    w += cw;
  }
  return w * size / 1000;
}
function pdfFit(str, size, maxW, bold) {
  str = String(str);
  if (pdfTextWidth(str, size, bold) <= maxW) return str;
  while (str.length > 1 && pdfTextWidth(str + '...', size, bold) > maxW) str = str.slice(0, -1);
  return str.trimEnd() + '...';
}
const hex01 = h => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

class MiniPDF {
  constructor(w = 595.28, h = 841.89) { this.W = w; this.H = h; this.pages = []; this.images = []; this.cur = null; this.addPage(); }
  addPage(h) { this.cur = { ops: [], h: h || this.H }; this.pages.push(this.cur); }
  _y(y) { return (this.cur.h - y).toFixed(2); }
  _clean(s) {
    return String(s).replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...')
      .replace(/[^\x00-\xff]/g, '?').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  }
  text(str, x, y, { size = 10, bold = false, align = 'left', color = [0, 0, 0] } = {}) {
    const w = pdfTextWidth(str, size, bold);
    if (align === 'right') x -= w; else if (align === 'center') x -= w / 2;
    this.cur.ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${color.map(c => c.toFixed(3)).join(' ')} rg ${x.toFixed(2)} ${this._y(y)} Td (${this._clean(str)}) Tj ET`);
  }
  rect(x, y, w, h, { fill = null, stroke = null, lw = 0.5 } = {}) {
    let op = '';
    if (fill) op += `${fill.map(c => c.toFixed(3)).join(' ')} rg `;
    if (stroke) op += `${stroke.map(c => c.toFixed(3)).join(' ')} RG ${lw} w `;
    op += `${x.toFixed(2)} ${(this.cur.h - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`;
    this.cur.ops.push(op);
  }
  line(x1, y1, x2, y2, { color = [.8, .8, .8], lw = 0.5 } = {}) {
    this.cur.ops.push(`${color.map(c => c.toFixed(3)).join(' ')} RG ${lw} w ${x1.toFixed(2)} ${this._y(y1)} m ${x2.toFixed(2)} ${this._y(y2)} l S`);
  }
  image(img, x, y, w, h) {                       // img = { data:Uint8Array(JPEG), w, h }
    let idx = this.images.indexOf(img);
    if (idx < 0) { this.images.push(img); idx = this.images.length - 1; }
    this.cur.ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(this.cur.h - y - h).toFixed(2)} cm /Im${idx} Do Q`);
  }
  output() {
    const parts = []; let len = 0; const offs = [];
    const enc = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; };
    const push = d => { const b = typeof d === 'string' ? enc(d) : d; parts.push(b); len += b.length; };
    const ni = this.images.length, np = this.pages.length;
    const pageObj = k => 5 + ni + 2 * k;
    const total = 5 + ni + 2 * np;                    // número de objetos + 1 (objeto 0)

    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    offs[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2] = len; push(`2 0 obj\n<< /Type /Pages /Kids [${this.pages.map((_, k) => pageObj(k) + ' 0 R').join(' ')}] /Count ${np} >>\nendobj\n`);
    offs[3] = len; push('3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n');
    offs[4] = len; push('4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n');
    this.images.forEach((im, i) => {
      const n = 5 + i; offs[n] = len;
      push(`${n} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`);
      push(im.data); push('\nendstream\nendobj\n');
    });
    const xobj = this.images.map((_, i) => `/Im${i} ${5 + i} 0 R`).join(' ');
    this.pages.forEach((pg, k) => {
      const po = pageObj(k), co = po + 1;
      offs[po] = len;
      push(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W.toFixed(2)} ${pg.h.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xobj} >> >> /Contents ${co} 0 R >>\nendobj\n`);
      const content = enc(pg.ops.join('\n'));
      offs[co] = len;
      push(`${co} 0 obj\n<< /Length ${content.length} >>\nstream\n`); push(content); push('\nendstream\nendobj\n');
    });
    const xref = len;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts, { type: 'application/pdf' });
  }
}

function dataUrlToBytes(url) {
  const b = atob(url.split(',')[1]); const a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function canvasToJpegImage(canvas, q = 0.92) {
  return { data: dataUrlToBytes(canvas.toDataURL('image/jpeg', q)), w: canvas.width, h: canvas.height };
}
function loadImage(src) {
  return new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}

/* ---------- Ticket (se dibuja en un canvas: sirve para imagen, PDF e impresión) ---------- */
const Ticket = {
  cur: null,

  async canvas(v) {
    const cfg = S.db.config, W = 440, P = 26, SC = 2;
    const logo = await loadImage(cfg.logo);
    const H = 900 + v.items.length * 110;
    const tmp = document.createElement('canvas');
    tmp.width = W * SC; tmp.height = H * SC;
    const c = tmp.getContext('2d');
    c.scale(SC, SC);
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    c.textBaseline = 'top';
    const FONT = '"Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    const F = (px, w = 400) => `${w} ${px}px ${FONT}`;
    let y = P;

    const wrap = (text, maxW) => {
      const words = String(text).split(/\s+/); const lines = []; let cur = '';
      for (const w of words) {
        const t = cur ? cur + ' ' + w : w;
        if (c.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      return lines;
    };
    const center = (text, px, weight = 400, color = '#111', gap = 3) => {
      c.font = F(px, weight); c.fillStyle = color; c.textAlign = 'center';
      wrap(text, W - 2 * P).forEach(l => { c.fillText(l, W / 2, y); y += px * 1.3; });
      y += gap;
    };
    const lr = (l, r, px, weight = 400, color = '#111', colorL = null) => {
      c.font = F(px, weight);
      c.textAlign = 'left'; c.fillStyle = colorL || color; c.fillText(l, P, y);
      c.textAlign = 'right'; c.fillStyle = color; c.fillText(r, W - P, y);
      y += px * 1.45;
    };
    const dash = () => { y += 4; c.strokeStyle = '#9aa'; c.setLineDash([5, 4]); c.lineWidth = 1; c.beginPath(); c.moveTo(P, y); c.lineTo(W - P, y); c.stroke(); c.setLineDash([]); y += 12; };

    if (logo) {
      const mh = 78, k = Math.min(mh / logo.height, 200 / logo.width), lw = logo.width * k, lh = logo.height * k;
      c.drawImage(logo, (W - lw) / 2, y, lw, lh); y += lh + 10;
    }
    center(cfg.negocio || 'Mi Bodega', 26, 800, '#000', 2);
    if (cfg.rif) center('RIF: ' + cfg.rif, 13, 400, '#444', 0);
    if (cfg.direccion) center(cfg.direccion, 13, 400, '#444', 0);
    if (cfg.telefono) center('Tel: ' + cfg.telefono, 13, 400, '#444', 0);
    dash();

    center(v.simulada ? 'PRESUPUESTO' : (cfg.ticketTitulo || 'TICKET DE VENTA'), 17, 800, '#000', 2);
    if (v.simulada) center('Simulación: no descuenta inventario ni es comprobante de pago', 12, 400, '#555', 4);
    else lr('N°', pad6(v.numero), 14, 700);
    const f = new Date(v.fecha);
    lr('Fecha', fmtDateTime(f), 14);
    if (v.cliente) lr('Cliente', v.cliente, 14);
    if (v.pago && !v.simulada) {
      lr('Pago', v.pagoDetalle ? 'Otro' : v.pago, 14);
      if (v.pagoDetalle) {
        c.font = F(13.5); c.fillStyle = '#222'; c.textAlign = 'left';
        wrap(v.pagoDetalle, W - 2 * P).forEach(l => { c.fillText(l, P, y); y += 19; });
        y += 2;
      }
    }
    dash();

    v.items.forEach(it => {
      c.font = F(15, 700); c.fillStyle = '#000'; c.textAlign = 'left';
      wrap(nombreCompleto(it), W - 2 * P).forEach(l => { c.fillText(l, P, y); y += 20; });
      const q = `${fmtQty(it.cantShow ?? it.cant)} ${uShort(it.ud || it.unidad)} × ${usd(it.precio)}/${uShort(it.unidad)}`;
      lr(q, usd(it.subtotal), 13.5, 600, '#000', '#555');
      y += 5;
    });
    dash();

    lr('Subtotal', usd(v.subtotal), 15, 500);
    if (v.descuento > 0) lr(`Descuento (${fmtNum(v.descPct, v.descPct % 1 ? 2 : 0)}%)`, '-' + usd(v.descuento), 15, 500);
    if (v.impuesto > 0) lr(`${v.impNombre || 'Impuesto'} (${fmtNum(v.impPct, v.impPct % 1 ? 2 : 0)}%)`, usd(v.impuesto), 15, 500);
    y += 6;
    lr('TOTAL USD', usd(v.total), 24, 800);
    if (v.tasa > 0) {
      lr('TOTAL Bs', bs(v.totalBs), 24, 800);
      c.font = F(12.5); c.fillStyle = '#555'; c.textAlign = 'right';
      c.fillText(`Tasa: 1 USD = ${bs(v.tasa)}`, W - P, y); y += 20;
    }
    if (v.recibido > 0) {
      y += 6;
      lr('Recibido', fmtM(v.recMoneda, v.recibido), 15, 500);
      lr('VUELTO', fmtM(v.recMoneda, v.vuelto), 19, 800);
    }
    dash();
    if (cfg.pie) center(cfg.pie, 14, 500, '#222', 8);
    center('Comprobante de venta · Documento no fiscal', 11.5, 400, '#666', 0);
    y += P;

    const h = Math.ceil(y);
    const out = document.createElement('canvas');
    out.width = W * SC; out.height = h * SC;
    out.getContext('2d').drawImage(tmp, 0, 0, W * SC, h * SC, 0, 0, W * SC, h * SC);
    return out;
  },

  fileBase(v) { return (v.simulada ? 'Presupuesto' : 'Ticket-' + pad6(v.numero)) + '_' + toInputDate(new Date(v.fecha)); },

  async openModal(v, { title = 'Ticket', exito = false } = {}) {
    const canvas = await Ticket.canvas(v);
    Ticket.cur = { v, canvas };
    const url = canvas.toDataURL('image/png');
    openModal({
      title,
      html: `${exito ? `<p class="muted-p" style="margin-bottom:12px">La venta se guardó y se descontó del inventario.</p>` : ''}
             <div class="ticket-wrap"><img class="ticket-img" src="${url}" alt="Ticket"></div>`,
      footer: `<div class="btn-row">
          <button class="btn" data-action="tk-pdf">${icon('pdf')}PDF</button>
          <button class="btn" data-action="tk-img">${icon('image')}Imagen</button>
          <button class="btn" data-action="tk-print">${icon('print')}Imprimir</button>
          <button class="btn" data-action="tk-share">${icon('share')}Enviar</button>
        </div>
        ${exito ? `<button class="btn btn-primary btn-block" data-modal-close>Nueva venta</button>` : ''}`
    });
  },

  pdfBlob() {
    const { canvas } = Ticket.cur;
    const w = 226.77, h = w * canvas.height / canvas.width;
    const doc = new MiniPDF(w, h);
    doc.image(canvasToJpegImage(canvas), 0, 0, w, h);
    return doc.output();
  },
  imgBlob() { return new Promise(res => Ticket.cur.canvas.toBlob(res, 'image/png')); },
  print() {
    const area = $('#print-area');
    const img = new Image();
    img.className = 'print-ticket';
    area.innerHTML = '';
    area.appendChild(img);
    $('#page-style').textContent = '@page { size: 80mm auto; margin: 0 }';
    img.onload = () => setTimeout(() => window.print(), 50);
    img.src = Ticket.cur.canvas.toDataURL('image/png');
  }
};
window.addEventListener('afterprint', () => { $('#print-area').innerHTML = ''; $('#page-style').textContent = ''; });

Actions['tk-pdf'] = () => downloadBlob(Ticket.pdfBlob(), Ticket.fileBase(Ticket.cur.v) + '.pdf');
Actions['tk-img'] = async () => downloadBlob(await Ticket.imgBlob(), Ticket.fileBase(Ticket.cur.v) + '.png');
Actions['tk-print'] = () => Ticket.print();
Actions['tk-share'] = async () => shareOrDownload(await Ticket.imgBlob(), Ticket.fileBase(Ticket.cur.v) + '.png', 'Ticket de venta');

/* ---------- Reportes en PDF (tabla A4) ---------- */
async function buildTablePDF({ titulo, subtitulo = '', cols, rows, resumen = [] }) {
  const cfg = S.db.config;
  const doc = new MiniPDF();
  const M = 36, CW = doc.W - 2 * M, ROW = 19;
  const brand = hex01(cfg.color || '#0f766e');
  const onBrand = [1, 1, 1];
  const grey = [.42, .45, .5];
  const logoImg = await loadImage(cfg.logo);
  const logo = logoImg ? (() => {
    const k = 120 / Math.max(logoImg.width, logoImg.height);
    const cv = document.createElement('canvas'); cv.width = Math.round(logoImg.width * k); cv.height = Math.round(logoImg.height * k);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(logoImg, 0, 0, cv.width, cv.height);
    return canvasToJpegImage(cv, 0.9);
  })() : null;
  const totalW = cols.reduce((s, c) => s + c.w, 0);
  const widths = cols.map(c => c.w / totalW * CW);
  let y;

  const tableHead = () => {
    doc.rect(M, y, CW, ROW + 2, { fill: brand });
    let x = M;
    cols.forEach((c, i) => {
      const tx = c.align === 'right' ? x + widths[i] - 6 : x + 6;
      doc.text(c.title, tx, y + 13.5, { size: 8.5, bold: true, color: onBrand, align: c.align === 'right' ? 'right' : 'left' });
      x += widths[i];
    });
    y += ROW + 2;
  };
  const header = first => {
    y = M;
    if (first) {
      let x = M;
      if (logo) {
        const k = 44 / Math.max(logo.w, logo.h);
        doc.image(logo, M, y, logo.w * k, logo.h * k);
        x += logo.w * k + 12;
      }
      doc.text(cfg.negocio || 'Mi Bodega', x, y + 17, { size: 19, bold: true });
      doc.text(titulo, x, y + 33, { size: 11, color: grey });
      doc.text('Generado: ' + fmtDateTime(new Date()), doc.W - M, y + 14, { size: 8.5, color: grey, align: 'right' });
      if (subtitulo) doc.text(subtitulo, doc.W - M, y + 26, { size: 8.5, color: grey, align: 'right' });
      if (Calc.hasTasa()) doc.text(`Tasa: 1 USD = ${bs(cfg.tasa)}`, doc.W - M, y + 38, { size: 8.5, color: grey, align: 'right' });
      y += 62;
    } else {
      doc.text(`${cfg.negocio || ''} · ${titulo}`, M, y + 8, { size: 8.5, color: grey });
      y += 22;
    }
    tableHead();
  };

  header(true);
  rows.forEach((r, ri) => {
    if (y + ROW > doc.H - M - 28) { doc.addPage(); header(false); }
    if (ri % 2 === 1) doc.rect(M, y, CW, ROW, { fill: [.96, .97, .98] });
    let x = M;
    cols.forEach((c, i) => {
      const raw = c.get(r);
      const bold = !!c.bold;
      const col = c.color ? (c.color(r) || [0.07, 0.09, 0.13]) : [0.07, 0.09, 0.13];
      const txt = pdfFit(raw, 8.5, widths[i] - 12, bold);
      doc.text(txt, c.align === 'right' ? x + widths[i] - 6 : x + 6, y + 13, { size: 8.5, bold, color: col, align: c.align === 'right' ? 'right' : 'left' });
      x += widths[i];
    });
    doc.line(M, y + ROW, M + CW, y + ROW, { color: [.9, .91, .93], lw: .4 });
    y += ROW;
  });
  if (!rows.length) doc.text('Sin registros para mostrar.', M + 6, y + 18, { size: 10, color: grey });

  if (resumen.length) {
    const bh = 12 + resumen.length * 16 + 8;
    if (y + bh + 14 > doc.H - M - 20) { doc.addPage(); y = M; }
    y += 14;
    const bw = 230, bx = doc.W - M - bw;
    doc.rect(bx, y, bw, bh, { fill: [.96, .97, .98], stroke: [.88, .9, .92] });
    resumen.forEach((r, i) => {
      const last = i === resumen.length - 1;
      doc.text(r[0], bx + 12, y + 20 + i * 16, { size: last ? 10 : 9, bold: last, color: last ? [0, 0, 0] : grey });
      doc.text(r[1], bx + bw - 12, y + 20 + i * 16, { size: last ? 10 : 9, bold: true, align: 'right' });
    });
  }
  const n = doc.pages.length;
  doc.pages.forEach((p, i) => { doc.cur = p; doc.text(`Página ${i + 1} de ${n}`, doc.W / 2, doc.H - 20, { size: 8, color: grey, align: 'center' }); });
  return doc.output();
}

/* ---------- Excel real (.xlsx) con bordes, sin librerías ---------- */
const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

function zipStore(files) {                       // files: [{name, data(string)}]  (sin compresión)
  const te = new TextEncoder(), parts = [], central = []; let off = 0;
  files.forEach(f => {
    const name = te.encode(f.name), data = te.encode(f.data), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/** cols: [{title, w, tipo:'texto'|'dinero'|'cant'}]  rows: [[valores]]  total: fila opcional (array, null = vacío) */
function xlsxBlob({ hoja, cols, rows, total }) {
  const X = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const L = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  const brand = (S.db.config.color || '#0f766e').replace('#', '').toUpperCase();
  const [r, g, b] = hex01('#' + brand); const claro = (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.6;
  // estilos: 0 normal | 1 encabezado | 2 texto | 3 dinero | 4 cantidad | 5 total texto | 6 total dinero
  const styleOf = t => t === 'dinero' ? 3 : t === 'cant' ? 4 : 2;
  const cell = (v, ref, s) => (v === null || v === undefined || v === '')
    ? `<c r="${ref}" s="${s}"/>`
    : (typeof v === 'number' ? `<c r="${ref}" s="${s}"><v>${v}</v></c>` : `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`);
  let n = 1;
  let sheetRows = `<row r="1" ht="24" customHeight="1">${cols.map((c, i) => cell(c.title, L(i) + 1, 1)).join('')}</row>`;
  rows.forEach(rw => { n++; sheetRows += `<row r="${n}">${cols.map((c, i) => cell(rw[i], L(i) + n, styleOf(c.tipo))).join('')}</row>`; });
  if (total) { n++; sheetRows += `<row r="${n}">${cols.map((c, i) => cell(total[i], L(i) + n, c.tipo === 'dinero' ? 6 : 5)).join('')}</row>`; }
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.w}" customWidth="1"/>`).join('')}</cols><sheetData>${sheetRows}</sheetData></worksheet>`;
  const border = '<border><left style="thin"><color rgb="FF8A8F98"/></left><right style="thin"><color rgb="FF8A8F98"/></right><top style="thin"><color rgb="FF8A8F98"/></top><bottom style="thin"><color rgb="FF8A8F98"/></bottom><diagonal/></border>';
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="${claro ? 'FF111111' : 'FFFFFFFF'}"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF${brand}"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF1F4"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${border}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="right"/></xf><xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="164" fontId="2" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const nombreHoja = X(hoja).slice(0, 30);
  return zipStore([
    { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${nombreHoja}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: 'xl/styles.xml', data: styles },
    { name: 'xl/worksheets/sheet1.xml', data: sheet }
  ]);
}

  /** Cierre del periodo (día / semana / mes / año): resumen contable en PDF */
  async cierrePDF(per, ref) {
    const r = rangoPeriodo(per, ref);
    const ok = Calc.validas().filter(v => { const d = new Date(v.fecha); return d >= r.from && d < r.to; });
    const hayGan = ok.some(v => v.ganancia != null), tasa = ok.some(v => v.tasa > 0);
    const buckets = [];
    if (per === 'ano') for (let m = 0; m < 12; m++) buckets.push({ label: cap(MESES[m]), a: new Date(r.from.getFullYear(), m, 1), b: new Date(r.from.getFullYear(), m + 1, 1) });
    else for (let d = new Date(r.from); d < r.to; d = addDays(d, 1)) buckets.push({ label: `${cap(DIAS[d.getDay()])} ${fmtDate(d)}`, a: d, b: addDays(d, 1) });
    const rows = buckets.map(k => {
      const vs = ok.filter(v => { const d = new Date(v.fecha); return d >= k.a && d < k.b; });
      return { label: k.label, n: vs.length, usd: Calc.sum(vs, 'total'), bs: Calc.sum(vs, 'totalBs'), gan: Calc.sum(vs.filter(v => v.ganancia != null), 'ganancia') };
    }).filter(x => x.n > 0);
    const cols = [
      { title: per === 'ano' ? 'MES' : 'DÍA', w: 30, get: x => x.label, bold: true },
      { title: 'VENTAS', w: 12, align: 'right', get: x => String(x.n) },
      { title: 'VENDIDO USD', w: 18, align: 'right', get: x => usd(x.usd) },
      { title: tasa ? 'VENDIDO Bs' : '', w: 20, align: 'right', get: x => tasa ? bs(x.bs) : '' },
      ...(hayGan ? [{ title: 'GANANCIA USD', w: 18, align: 'right', get: x => usd(x.gan) }] : [])
    ];
    const total = Calc.sum(ok, 'total');
    const resumen = [['Ventas realizadas', String(ok.length)], ['Promedio por venta', usd(ok.length ? total / ok.length : 0)]];
    const imp = Calc.sum(ok, 'impuesto'); if (imp > 0) resumen.push([`${S.db.config.impuestoNombre || 'Impuesto'} cobrado (USD)`, usd(imp)]);
    if (tasa) resumen.push(['Total vendido (Bs)', bs(Calc.sum(ok, 'totalBs'))]);
    if (hayGan) resumen.push(['Ganancia estimada (USD)', usd(Calc.sum(ok.filter(v => v.ganancia != null), 'ganancia'))]);
    resumen.push(['TOTAL VENDIDO (USD)', usd(total)]);
    const nombre = { dia: 'diario', semana: 'semanal', mes: 'mensual', ano: 'anual' }[per];
    const blob = await buildTablePDF({ titulo: `Cierre ${nombre}`, subtitulo: r.label, cols, rows, resumen });
    downloadBlob(blob, `Cierre_${nombre}_${r.label.replace(/[^\w]+/g, '_')}.pdf`);
    toast('Cierre guardado en Descargas');
  }
};

      if (S.inv.f.startsWith('cat:') && p.categoria !== S.inv.f.slice(4)) return false;

      return norm([p.nombre, p.presentacion, p.categoria, p.sku].join(' ')).includes(q);

            ${S.db.config.costoActivo && p.costo > 0 ? `<small style="${p.precio < p.costo ? 'color:var(--danger)' : ''}">Costo ${usd(p.costo)} · ${p.precio < p.costo ? 'pierdes' : 'ganas'} ${fmtNum(Math.abs(Calc.margen(p)), 0)}%</small>` : ''}</div>

          <button class="icon-btn danger" data-action="prod-borrar" data-id="${p.id}" aria-label="Eliminar">${icon('trash')}</button>
        </div>
      </article>`;
    }).join('')}</div>`;
  },

  formProducto(p) {

      </div>
      <div class="field"><label>Se vende por</label><select class="select" name="unidad" data-input="prod-unidad" ${edit ? 'disabled' : ''}>${unitOpts}</select></div>

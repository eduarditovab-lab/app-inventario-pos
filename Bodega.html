        <div class="field"><label>% de ganancia</label><input class="input" name="margen" type="number" inputmode="decimal" step="any" min="0" value="${p.costo > 0 ? Math.round(Calc.margen(p) * 10) / 10 : (S.db.config.margenDefecto || '')}" placeholder="Ej: 30" data-input="prod-calc"></div>
      </div>` : ''}
      <div class="field"><label id="lbl-precio">Precio de venta por ${uShort(p.unidad)} (USD) *</label><input class="input" name="precio" type="number" inputmode="decimal" step="any" min="0" value="${p.precio}" placeholder="0.00" data-input="prod-precio"></div>
      <div class="hint" id="precio-bs"></div>
      <div class="field-row">

        <div class="field"><label id="lbl-min">Avisar si baja de (${uShort(p.unidad)})</label><input class="input" name="minimo" type="number" inputmode="decimal" step="any" min="0" value="${p.minimo ?? S.db.config.stockMinimo}"></div>

  $('#lbl-precio', m).textContent = `Precio de venta por ${uShort(u)} (USD) *`;
  const lc = $('#lbl-costo', m); if (lc) lc.textContent = `Costo por ${uShort(u)} (USD)`;
  const ls = $('#lbl-stock', m); if (ls) ls.textContent = `Stock inicial (${uShort(u)})`;
  $('#lbl-min', m).textContent = `Avisar si baja de (${uShort(u)})`;
  if (ls) $('[name=minimo]', m).value = MIN_DEFAULT[u];
};
/* Costo ↔ % ganancia ↔ precio (solo si "Costo y ganancia" está activo en Ajustes) */
Inputs['prod-calc'] = t => {
  const m = t.closest('.modal'), f = n => $(`[name=${n}]`, m);
  const costo = num(f('costo').value), margen = num(f('margen').value), precio = num(f('precio').value);
  const r4 = x => Math.round(x * 1e4) / 1e4;
  if (costo > 0 && !isNaN(margen)) f('precio').value = r4(costo * (1 + margen / 100));
  else if (costo > 0 && isNaN(margen) && precio > 0) f('margen').value = Math.round((precio / costo - 1) * 1000) / 10;
  Inputs['prod-precio'](f('precio'), true);
};
Inputs['prod-precio'] = (t, fromCalc) => {
  const m = t.closest('.modal'), v = num(t.value), box = $('#precio-bs', m);
  const fc = $('[name=costo]', m);
  if (fc && fromCalc !== true) {                              // si cambian el precio a mano, recalcula el % de ganancia
    const costo = num(fc.value);
    if (costo > 0 && v > 0) $('[name=margen]', m).value = Math.round((v / costo - 1) * 1000) / 10;
  }
  let txt = (Calc.hasTasa() && v > 0) ? `Equivale a ${bs(Calc.toBs(v))} con la tasa actual (${fmtNum(S.db.config.tasa)}). ` : '';
  if (fc) {
    const costo = num(fc.value);
    if (costo > 0 && v > 0) txt += v >= costo ? `Ganas ${usd(v - costo)} por cada unidad vendida.` : `⚠ Estás vendiendo por debajo del costo (pierdes ${usd(costo - v)}).`;
  }
  box.textContent = txt;
};

Actions['prod-guardar'] = t => {
  const m = t.closest('.modal'), id = t.dataset.id, f = n => $(`[name=${n}]`, m);
  const nombre = f('nombre').value.trim(), presentacion = f('presentacion').value.trim();
  const categoria = f('categoria').value.trim(), unidad = f('unidad').value;
  const precio = num(f('precio').value), minimo = num(f('minimo').value);
  const sku = f('sku').value.trim();
  const hayCosto = !!f('costo');
  const costo = hayCosto ? (f('costo').value === '' ? null : num(f('costo').value)) : undefined;
  if (hayCosto && costo !== null && (isNaN(costo) || costo < 0)) return toast('Escribe un costo válido', 'err');
  const stock = id ? null : (f('stock') && f('stock').value !== '' ? num(f('stock').value) : 0);
  if (!nombre) return toast('Escribe el nombre del producto', 'err');
  if (isNaN(precio) || precio < 0) return toast('Escribe un precio válido', 'err');
  if (!id && (isNaN(stock) || stock < 0)) return toast('Escribe un stock válido', 'err');
  if (unidad === 'und' && !id && !Number.isInteger(stock)) return toast('Los productos por unidad llevan cantidades enteras', 'err');
  const dup = S.db.productos.find(p => p.id !== id && norm(p.nombre) === norm(nombre) && norm(p.presentacion || '') === norm(presentacion));
  if (dup) return toast('Ya existe un producto con ese nombre y presentación', 'err');
  if (categoria && !S.db.categorias.some(c => norm(c) === norm(categoria))) S.db.categorias.push(categoria);

  if (id) {
    Object.assign(Calc.prod(id), { nombre, presentacion, categoria, precio, minimo: isNaN(minimo) ? S.db.config.stockMinimo : minimo, sku });
    if (hayCosto) Calc.prod(id).costo = costo;
    toast('Producto actualizado');
  } else {
    const p = { id: uid(), nombre, presentacion, categoria, unidad, precio, stock: rq(stock), minimo: isNaN(minimo) ? MIN_DEFAULT[unidad] : minimo, sku, creado: new Date().toISOString() };
    if (hayCosto) p.costo = costo;
    S.db.productos.push(p);
    if (p.stock > 0) S.db.movimientos.push({ id: uid(), fecha: new Date().toISOString(), pid: p.id, nombre: nombreCompleto(p), tipo: 'entrada', cant: p.stock, unidad, nota: 'Stock inicial' });
    toast('Producto agregado');
  }
  closeTopModal(); Storage.save(); App.render();
};

Actions['prod-borrar'] = async t => {
  const p = Calc.prod(t.dataset.id); if (!p) return;
  const ok = await confirmDialog({ title: 'Eliminar producto', msg: `¿Seguro que quieres eliminar <b>${esc(nombreCompleto(p))}</b> del inventario? El historial de ventas no se borra.`, ok: 'Eliminar', danger: true });
  if (!ok) return;
  S.db.productos = S.db.productos.filter(x => x.id !== p.id);

};

Actions['prod-demo'] = () => {

    S.db.movimientos.push({ id: uid(), fecha: new Date().toISOString(), pid: p.id, nombre: nombreCompleto(p), tipo: 'entrada', cant: stock, unidad, nota: 'Stock inicial' });
  });

/* ----- Ajuste de stock ----- */
Actions['prod-stock'] = t => {
  const p = Calc.prod(t.dataset.id); if (!p) return;
  const units = compatibleUnits(p.unidad);
  openModal({
    title: 'Ajustar stock',
    html: `<div class="form">
      <div><b>${esc(nombreCompleto(p))}</b><div class="muted">Stock actual: ${fmtQty(p.stock)} ${uShort(p.unidad)}</div></div>
      <div class="field"><label>¿Qué quieres hacer?</label>
        <select class="select" name="tipo" data-input="stk-prev">
          <option value="entrada">Agregar mercancía (entrada)</option>
          <option value="salida">Quitar mercancía (merma, daño, consumo)</option>
          <option value="fijar">Corregir el total (conteo físico)</option>
        </select></div>
      <div class="field-row">
        <div class="field"><label>Cantidad</label><input class="input" name="cant" type="number" inputmode="decimal" step="any" min="0" placeholder="0" data-input="stk-prev" autofocus></div>
        <div class="field"><label>Unidad</label><select class="select" name="ud" data-input="stk-prev">${units.map(u => `<option value="${u}" ${u === p.unidad ? 'selected' : ''}>${UNITS[u].short}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Nota (opcional)</label><input class="input" name="nota" placeholder="Ej: compra al proveedor" autocomplete="off"></div>
      <div class="preview-box"><span class="muted">Quedará en</span><b id="stk-new">${fmtQty(p.stock)} ${uShort(p.unidad)}</b></div>
    </div>`,
    footer: `<button class="btn" data-modal-close>Cancelar</button><button class="btn btn-primary" data-submit data-action="stk-guardar" data-id="${p.id}">${icon('check')}Guardar</button>`
  });
};
function calcStock(m, p) {
  const tipo = $('[name=tipo]', m).value, ud = $('[name=ud]', m).value;
  const c = num($('[name=cant]', m).value);
  if (isNaN(c)) return { nuevo: p.stock, delta: 0, valid: false };
  const q = convert(c, ud, p.unidad);
  const nuevo = tipo === 'entrada' ? rq(p.stock + q) : tipo === 'salida' ? rq(p.stock - q) : q;
  return { nuevo, delta: rq(nuevo - p.stock), valid: true, tipo };
}
Inputs['stk-prev'] = t => {
  const m = t.closest('.modal'), p = Calc.prod($('[data-action=stk-guardar]', m).dataset.id);
  const r = calcStock(m, p);
  const el = $('#stk-new', m);
  el.textContent = `${fmtQty(r.nuevo)} ${uShort(p.unidad)}`;
  el.style.color = r.nuevo < 0 ? 'var(--danger)' : '';
};
Actions['stk-guardar'] = t => {
  const m = t.closest('.modal'), p = Calc.prod(t.dataset.id);
  const r = calcStock(m, p);
  if (!r.valid || Number($('[name=cant]', m).value) < 0) return toast('Escribe una cantidad válida', 'err');
  if (r.nuevo < 0) return toast('No puedes quitar más de lo que hay en stock', 'err');
  if (p.unidad === 'und' && !Number.isInteger(r.nuevo)) return toast('Este producto se maneja en unidades enteras', 'err');
  if (r.delta === 0) return toast('No hay cambios que guardar', 'err');
  p.stock = r.nuevo;
  S.db.movimientos.push({ id: uid(), fecha: new Date().toISOString(), pid: p.id, nombre: nombreCompleto(p), tipo: r.tipo === 'fijar' ? 'ajuste' : r.tipo, cant: r.delta, unidad: p.unidad, nota: $('[name=nota]', m).value.trim() });
  closeTopModal(); Storage.save(); App.render(); toast('Stock actualizado');
};


/* ventas.js — Punto de venta: cuenta (carrito), impuesto, tasa en Bs, cobro y simulación */

const PAGOS = ['Efectivo USD', 'Efectivo Bs', 'Pago móvil', 'Punto de venta', 'Transferencia', 'Otro'];
const QUICK = { und: [1, 2, 3, 6, 12], kg: [0.25, 0.5, 1, 2], g: [100, 250, 500, 1000], mg: [100, 250, 500], l: [0.5, 1, 1.5, 2], ml: [250, 500, 1000] };

const Ventas = {
  impPct() { const c = S.db.config; return (c.impuestoActivo && S.pos.aplicaImp) ? Number(c.impuestoPct) || 0 : 0; },

  resetCart() {
    const c = S.db.config;
    Object.assign(S.pos, { cart: [], cliente: '', pago: 'Efectivo USD', pagoDetalle: '', descPct: 0, aplicaImp: !!(c.impuestoActivo && c.impuestoPorDefecto), pane: 'productos', recibido: 0, rmoneda: Calc.hasTasa() ? 'Bs' : 'USD' });
  },

  /** Campo de texto que aparece al elegir "Otro" (pagos mixtos, por ejemplo) */
  pagoOtroHtml() {
    if (S.pos.pago !== 'Otro') return '';
    return `<div class="field"><label>Detalle del pago</label><input class="input" data-input="pos-pago-det" value="${esc(S.pos.pagoDetalle)}" placeholder="Ej: $5 efectivo + Bs 500 punto" maxlength="120" autocomplete="off"></div>`;
  },

  /** Vuelto: null si la opción está apagada o no se escribió monto recibido */
  vueltoInfo() {
    const P = S.pos;
    if (!S.db.config.vueltoActivo || !(P.recibido > 0) || !P.cart.length) return null;
    const moneda = (P.rmoneda === 'Bs' && Calc.hasTasa()) ? 'Bs' : 'USD';
    const t = Ventas.totales();
    const debe = moneda === 'Bs' ? Calc.toBs(t.total) : t.total;
    return { moneda, recibido: P.recibido, debe, diff: round2(P.recibido - debe) };
  },

  /** Líneas de la cuenta con los precios actuales del inventario */
  lineas() {
    S.pos.cart = S.pos.cart.filter(ci => Calc.prod(ci.pid));
    return S.pos.cart.map(ci => {
      const p = Calc.prod(ci.pid);
      return { ci, p, subtotal: round2(p.precio * ci.cant) };
    });
  },

  totales() {
    const ls = Ventas.lineas();
    return Calc.totales(ls, S.pos.descPct, Ventas.impPct());
  },

  buildVenta(simulada) {
    const cfg = S.db.config, P = S.pos;
    const items = Ventas.lineas().map(({ ci, p, subtotal }) => ({
      pid: p.id, nombre: p.nombre, presentacion: p.presentacion, unidad: p.unidad,
      cant: ci.cant, ud: ci.ud, cantShow: rq(convert(ci.cant, p.unidad, ci.ud)), precio: p.precio, subtotal,
      costo: (cfg.costoActivo && p.costo > 0) ? p.costo : null
    }));
    const impPct = Ventas.impPct();
    const t = Calc.totales(items, P.descPct, impPct);
    // Ganancia = lo vendido menos lo que costó (solo productos con costo), descontando el descuento proporcional
    let ganancia = null;
    const conCosto = items.filter(i => i.costo != null);
    if (conCosto.length) {
      const profit = conCosto.reduce((s, i) => s + (i.subtotal - i.costo * i.cant), 0);
      const subC = conCosto.reduce((s, i) => s + i.subtotal, 0);
      ganancia = round2(profit - t.descuento * (t.subtotal ? subC / t.subtotal : 0));
    }
    const tasa = Calc.hasTasa() ? Number(cfg.tasa) : 0;
    const vi = Ventas.vueltoInfo();
    const extra = (vi && vi.diff >= 0) ? { recibido: vi.recibido, recMoneda: vi.moneda, vuelto: vi.diff } : {};
    return {
      ...extra, ganancia,
      id: uid(), fecha: new Date().toISOString(), cliente: P.cliente.trim(), pago: P.pago, pagoDetalle: P.pago === 'Otro' ? (P.pagoDetalle || '').trim() : '', tasa, items,
      subtotal: t.subtotal, descPct: P.descPct, descuento: t.descuento,
      impPct, impNombre: cfg.impuestoNombre, impuesto: t.impuesto,
      total: t.total, totalBs: tasa ? round2(t.total * tasa) : 0, simulada: !!simulada
    };
  },

  render(root) {
    const P = S.pos, cfg = S.db.config;
    if (!cfg.impuestoActivo) P.aplicaImp = false;
    root.innerHTML = `
      <div class="page-head"><div><h1>Vender</h1><p class="sub">Toca un producto para agregarlo a la cuenta</p></div></div>
      <div class="seg full pos-switch">
        <button class="${P.pane === 'productos' ? 'on' : ''}" data-action="pos-pane" data-pane="productos">Productos</button>
        <button class="${P.pane === 'carrito' ? 'on' : ''}" data-action="pos-pane" data-pane="carrito">Cuenta <span class="count" id="pos-count">0</span></button>
      </div>
      <div class="pos" data-pane="${P.pane}">
        <section class="pos-catalog">
          <label class="search">${icon('search')}<input type="search" placeholder="Buscar producto…" value="${esc(P.q)}" data-input="pos-q" autocomplete="off"></label>
          <div class="chips" id="pos-chips"></div>
          <div class="tiles" id="pos-tiles"></div>
        </section>
        <aside class="pos-cart card">
          <div class="card-head"><h3>Cuenta actual</h3><button class="link" data-action="cart-clear">Vaciar</button></div>
          <div id="cart-items"></div>
          <div class="cart-opts">
            <div class="field-row">
              <div class="field"><label>Cliente (opcional)</label><input class="input" data-input="pos-cliente" value="${esc(P.cliente)}" placeholder="Nombre" autocomplete="off"></div>
              <div class="field"><label>Forma de pago</label><select class="select" data-input="pos-pago">${PAGOS.map(x => `<option ${x === P.pago ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
            </div>
            <div id="pago-otro">${Ventas.pagoOtroHtml()}</div>
            <div class="field-row" style="align-items:end">
              <div class="field"><label>Descuento (%)</label><input class="input" type="number" inputmode="decimal" min="0" max="100" step="any" value="${P.descPct || ''}" placeholder="0" data-input="pos-desc"></div>
              ${cfg.impuestoActivo ? `<label class="switch-line"><input type="checkbox" data-change="pos-imp" ${P.aplicaImp ? 'checked' : ''}><span class="sw"></span><span>${esc(cfg.impuestoNombre)} ${fmtNum(cfg.impuestoPct, cfg.impuestoPct % 1 ? 2 : 0)}%</span></label>` : '<div></div>'}
            </div>
            ${cfg.vueltoActivo ? `<div class="field-row">
              <div class="field"><label>Monto recibido</label><input class="input" type="number" inputmode="decimal" min="0" step="any" value="${P.recibido || ''}" placeholder="Con cuánto paga" data-input="pos-recibido"></div>
              <div class="field"><label>En</label><select class="select" data-input="pos-rmoneda"><option value="Bs" ${P.rmoneda === 'Bs' ? 'selected' : ''}>Bolívares (Bs)</option><option value="USD" ${P.rmoneda === 'USD' ? 'selected' : ''}>Dólares ($)</option></select></div>
            </div>` : ''}
          </div>
          <div id="cart-totals"></div>
          <div class="cart-actions">
            <button class="btn" data-action="pos-simular">${icon('eye')}Simular</button>
            <button class="btn btn-primary btn-lg" data-action="pos-cobrar">${icon('check')}Cobrar</button>
          </div>
        </aside>
      </div>
      <div class="cart-bar" id="cart-bar"></div>`;
    this.renderChips();
    this.renderTiles();
    this.renderCart();
  },

  renderChips() {
    const cats = [...new Set(S.db.productos.map(p => p.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
    const chip = (c, label) => `<button class="chip-f ${S.pos.cat === c ? 'on' : ''}" data-action="pos-cat" data-c="${esc(c)}">${esc(label)}</button>`;
    $('#pos-chips').innerHTML = chip('', 'Todos') + cats.map(c => chip(c, c)).join('');
  },

  renderTiles() {
    const q = norm(S.pos.q.trim());
    const ps = S.db.productos.filter(p => (!S.pos.cat || p.categoria === S.pos.cat) && (!q || norm([p.nombre, p.presentacion, p.sku].join(' ')).includes(q)))
      .sort((a, b) => nombreCompleto(a).localeCompare(nombreCompleto(b), 'es'));
    const box = $('#pos-tiles');
    if (!S.db.productos.length) { box.innerHTML = `<div class="card empty" style="grid-column:1/-1">${icon('box')}<h4>No hay productos</h4><p>Primero agrega productos en el inventario.</p><button class="btn btn-primary" data-action="nav" data-v="inventario">Ir al inventario</button></div>`; return; }
    if (!ps.length) { box.innerHTML = `<p class="muted" style="grid-column:1/-1;padding:20px 4px">No se encontraron productos.</p>`; return; }
    box.innerHTML = ps.map(p => {
      const enCarro = S.pos.cart.find(c => c.pid === p.id);
      return `<button class="tile ${Calc.agotado(p) ? 'out' : ''}" data-action="pos-add" data-id="${p.id}">
        <div><div class="t-name">${esc(p.nombre)}</div>${p.presentacion ? `<div class="t-pres">${esc(p.presentacion)}</div>` : ''}</div>
        <div class="t-foot">
          <div class="t-price">${usd(p.precio)}<small>/${uShort(p.unidad)}</small></div>
          <div class="t-stock ${Calc.stockBajo(p) ? 'low' : ''}">${Calc.agotado(p) ? 'Agotado' : fmtQty(p.stock) + ' ' + uShort(p.unidad)}${enCarro ? '<br>✓ en cuenta' : ''}</div>
        </div></button>`;
    }).join('');
  },

  renderCart() {
    const ls = Ventas.lineas(), P = S.pos, t = Ventas.totales(), tasa = Calc.hasTasa();
    const box = $('#cart-items');
    if (!box) return;
    box.innerHTML = ls.length ? ls.map(({ ci, p, subtotal }, i) => {
      const enUnd = p.unidad === 'und';
      return `<div class="cart-item">
        <div><div class="ci-name">${esc(p.nombre)}${p.presentacion ? ` <span class="chip">${esc(p.presentacion)}</span>` : ''}</div>
          <div class="ci-sub">${usd(p.precio)} / ${uShort(p.unidad)}</div></div>
        <div class="ci-price">${usd(subtotal)}${tasa ? `<small>${bs(Calc.toBs(subtotal))}</small>` : ''}</div>
        <div class="ci-ctrl">
          <div class="stepper">
            ${enUnd ? `<button data-action="ci-dec" data-i="${i}" aria-label="Menos">${icon('minus')}</button>` : ''}
            <button class="q" data-action="ci-edit" data-i="${i}" title="Cambiar cantidad">${fmtQty(convert(ci.cant, p.unidad, ci.ud))} ${uShort(ci.ud)}</button>
            ${enUnd ? `<button data-action="ci-inc" data-i="${i}" aria-label="Más">${icon('plus')}</button>` : ''}
          </div>
          <span class="spacer"></span>
          <button class="btn btn-sm" data-action="ci-del" data-i="${i}" aria-label="Quitar de la cuenta" style="color:var(--danger)">${icon('trash')}Quitar</button>
        </div></div>`;
    }).join('') : `<div class="empty" style="padding:26px 10px">${icon('cart')}<p>La cuenta está vacía.<br>Elige productos de la lista.</p></div>`;

    const cfg = S.db.config;
    $('#cart-totals').innerHTML = `<div class="totals">
      <div class="row"><span>Subtotal</span><b>${usd(t.subtotal)}</b></div>
      ${t.descuento > 0 ? `<div class="row"><span>Descuento (${fmtNum(P.descPct, P.descPct % 1 ? 2 : 0)}%)</span><b>-${usd(t.descuento)}</b></div>` : ''}
      ${Ventas.impPct() > 0 ? `<div class="row"><span>${esc(cfg.impuestoNombre)} (${fmtNum(Ventas.impPct(), Ventas.impPct() % 1 ? 2 : 0)}%)</span><b>${usd(t.impuesto)}</b></div>` : ''}
      <div class="grand"><span>Total USD</span><strong>${usd(t.total)}</strong></div>
      ${tasa
        ? `<div class="grand bs"><span>Total Bs</span><strong>${bs(Calc.toBs(t.total))}</strong></div><div class="tasa-note">Tasa: 1 USD = ${bs(cfg.tasa)}</div>`
        : `<div class="tasa-note"><button class="link" data-action="edit-tasa">Poner tasa del dólar para ver el total en Bs</button></div>`}
      ${(() => {
        const vi = Ventas.vueltoInfo(); if (!vi) return '';
        const eq = !Calc.hasTasa() ? '' : vi.moneda === 'Bs' ? '≈ ' + usd(Math.abs(vi.diff) / cfg.tasa) : '≈ ' + bs(Math.abs(vi.diff) * cfg.tasa);
        return `<div class="grand vuelto ${vi.diff < 0 ? 'falta' : ''}"><span>${vi.diff < 0 ? 'Falta' : 'Vuelto'}</span><strong>${fmtM(vi.moneda, Math.abs(vi.diff))}</strong></div>
          <div class="tasa-note">Recibido ${fmtM(vi.moneda, vi.recibido)} · ${eq}</div>`;
      })()}
    </div>`;

    const n = ls.length;
    const cnt = $('#pos-count'); if (cnt) cnt.textContent = n;
    const bar = $('#cart-bar');
    if (bar) {
      bar.classList.toggle('show', n > 0 && P.pane === 'productos');
      bar.innerHTML = `<div><b>${usd(t.total)}</b><small>${tasa ? bs(Calc.toBs(t.total)) + ' · ' : ''}${n} producto${n === 1 ? '' : 's'}</small></div>
        <button class="btn" data-action="pos-pane" data-pane="carrito">Ver cuenta ${icon('chevR')}</button>`;
    }
  },

  /** Ventana de cantidad (para peso, volumen o editar) */
  openQty(pid, idx = -1) {
    const p = Calc.prod(pid); if (!p) return;
    const cur = idx >= 0 ? S.pos.cart[idx] : null;
    const units = compatibleUnits(p.unidad);
    const u0 = cur ? cur.ud : p.unidad;
    const v0 = cur ? fmtQty(convert(cur.cant, p.unidad, cur.ud)).replace(/\./g, '').replace(',', '.') : '';
    openModal({
      title: nombreCompleto(p),
      html: `<div class="form" data-pid="${p.id}" data-idx="${idx}">
        <div class="muted" id="qty-disp"></div>
        <div class="field-row">
          <div class="field"><label>Cantidad</label><input class="input" name="cant" type="number" inputmode="decimal" step="any" min="0" value="${v0}" placeholder="0" data-input="qty" autofocus></div>
          <div class="field"><label>Unidad</label><select class="select" name="ud" data-input="qty-unit">${units.map(u => `<option value="${u}" ${u === u0 ? 'selected' : ''}>${UNITS[u].label}</option>`).join('')}</select></div>
        </div>
        <div class="quick" id="qty-quick"></div>
        <div class="preview-box"><span class="muted">Subtotal</span><div style="text-align:right"><b id="qty-sub">$0,00</b><div class="muted" id="qty-bs"></div></div></div>
      </div>`,
      footer: `<button class="btn" data-modal-close>Cancelar</button><button class="btn btn-primary" data-submit data-action="qty-ok">${icon('check')}${cur ? 'Actualizar' : 'Agregar'}</button>`,
      onMount: m => Ventas.qtyRefresh(m.el)
    });
  },
  disponible(p, idx) {
    const otros = S.pos.cart.reduce((s, c, i) => s + (c.pid === p.id && i !== idx ? c.cant : 0), 0);
    return rq(p.stock - otros);
  },
  qtyRefresh(root, rebuildQuick = true) {
    const f = $('[data-pid]', root), p = Calc.prod(f.dataset.pid), idx = Number(f.dataset.idx);
    const ud = $('[name=ud]', root).value, c = num($('[name=cant]', root).value);
    $('#qty-disp', root).textContent = `Disponible: ${fmtQty(Ventas.disponible(p, idx))} ${uShort(p.unidad)} · ${usd(p.precio)} por ${uShort(p.unidad)}`;
    if (rebuildQuick) $('#qty-quick', root).innerHTML = (QUICK[ud] || []).map(q => `<button type="button" class="chip-f" data-action="qty-quick" data-v="${q}">${fmtQty(q)} ${uShort(ud)}</button>`).join('');
    const sub = (!isNaN(c) && c > 0) ? round2(p.precio * convert(c, ud, p.unidad)) : 0;
    $('#qty-sub', root).textContent = usd(sub);
    $('#qty-bs', root).textContent = Calc.hasTasa() ? bs(Calc.toBs(sub)) : '';
  }
};

Inputs['pos-q'] = t => { S.pos.q = t.value; Ventas.renderTiles(); };
Actions['pos-cat'] = t => { S.pos.cat = t.dataset.c; Ventas.renderChips(); Ventas.renderTiles(); };
Actions['pos-pane'] = t => { S.pos.pane = t.dataset.pane; Ventas.render($('#view')); window.scrollTo(0, 0); };
Inputs['pos-cliente'] = t => { S.pos.cliente = t.value; };
Inputs['pos-pago'] = t => {
  S.pos.pago = t.value;
  $('#pago-otro').innerHTML = Ventas.pagoOtroHtml();
  const i = $('#pago-otro input'); if (i) i.focus();
};
Inputs['pos-pago-det'] = t => { S.pos.pagoDetalle = t.value; };
Inputs['pos-recibido'] = t => { const v = num(t.value); S.pos.recibido = isNaN(v) || v < 0 ? 0 : v; Ventas.renderCart(); };
Inputs['pos-rmoneda'] = t => { S.pos.rmoneda = t.value; Ventas.renderCart(); };
Inputs['pos-desc'] = t => { let v = num(t.value); if (isNaN(v) || v < 0) v = 0; if (v > 100) { v = 100; t.value = 100; } S.pos.descPct = v; Ventas.renderCart(); };
Changes['pos-imp'] = t => { S.pos.aplicaImp = t.checked; Ventas.renderCart(); };

Actions['pos-add'] = t => {
  const p = Calc.prod(t.dataset.id); if (!p || Calc.agotado(p)) return;
  if (p.unidad === 'und') {
    const ci = S.pos.cart.find(c => c.pid === p.id);
    if ((ci ? ci.cant : 0) + 1 > p.stock) return toast(`Solo quedan ${fmtQty(p.stock)} ${uShort(p.unidad)}`, 'err');
    if (ci) ci.cant += 1; else S.pos.cart.push({ pid: p.id, cant: 1, ud: 'und' });
    Ventas.renderTiles(); Ventas.renderCart();
  } else {
    const idx = S.pos.cart.findIndex(c => c.pid === p.id);
    Ventas.openQty(p.id, idx);
  }
};
Actions['ci-inc'] = t => {
  const ci = S.pos.cart[+t.dataset.i], p = Calc.prod(ci.pid);
  if (ci.cant + 1 > p.stock) return toast(`Solo quedan ${fmtQty(p.stock)} ${uShort(p.unidad)}`, 'err');
  ci.cant += 1; Ventas.renderCart();
};
Actions['ci-dec'] = t => {
  const i = +t.dataset.i, ci = S.pos.cart[i];
  if (ci.cant <= 1) S.pos.cart.splice(i, 1); else ci.cant -= 1;
  Ventas.renderTiles(); Ventas.renderCart();
};
Actions['ci-del'] = t => { S.pos.cart.splice(+t.dataset.i, 1); Ventas.renderTiles(); Ventas.renderCart(); };
Actions['ci-edit'] = t => { const i = +t.dataset.i; Ventas.openQty(S.pos.cart[i].pid, i); };
Actions['cart-clear'] = async () => {
  if (!S.pos.cart.length) return;
  if (await confirmDialog({ title: 'Vaciar cuenta', msg: '¿Quitar todos los productos de la cuenta actual?', ok: 'Vaciar', danger: true })) {
    S.pos.cart = []; Ventas.renderTiles(); Ventas.renderCart();
  }
};

Inputs['qty'] = t => Ventas.qtyRefresh(t.closest('.modal'), false);
Inputs['qty-unit'] = t => Ventas.qtyRefresh(t.closest('.modal'), true);
Actions['qty-quick'] = t => {
  const m = t.closest('.modal'), inp = $('[name=cant]', m);
  inp.value = t.dataset.v; Ventas.qtyRefresh(m, false);
};
Actions['qty-ok'] = t => {
  const m = t.closest('.modal'), f = $('[data-pid]', m);
  const p = Calc.prod(f.dataset.pid), idx = Number(f.dataset.idx);
  const ud = $('[name=ud]', m).value, c = num($('[name=cant]', m).value);
  if (isNaN(c) || c <= 0) return toast('Escribe una cantidad mayor a 0', 'err');
  const cant = convert(c, ud, p.unidad);
  if (p.unidad === 'und' && !Number.isInteger(cant)) return toast('Este producto solo se vende en unidades enteras', 'err');
  const disp = Ventas.disponible(p, idx);
  if (cant > disp + 1e-9) return toast(`No hay suficiente stock. Disponible: ${fmtQty(disp)} ${uShort(p.unidad)}`, 'err');
  if (idx >= 0) S.pos.cart[idx] = { pid: p.id, cant, ud };
  else S.pos.cart.push({ pid: p.id, cant, ud });
  closeTopModal(); Ventas.renderTiles(); Ventas.renderCart();
};

Actions['pos-simular'] = () => {
  if (!S.pos.cart.length) return toast('Agrega productos a la cuenta primero', 'err');
  Ticket.openModal(Ventas.buildVenta(true), { title: 'Simulación de venta' });
};

Actions['pos-cobrar'] = () => {
  const P = S.pos;
  if (!P.cart.length) return toast('Agrega productos a la cuenta primero', 'err');
  for (const { ci, p } of Ventas.lineas()) {
    if (ci.cant > p.stock + 1e-9) return toast(`No hay suficiente stock de ${nombreCompleto(p)}`, 'err');
  }
  const vi = Ventas.vueltoInfo();
  if (vi && vi.diff < 0) return toast(`El monto recibido no alcanza. Faltan ${fmtM(vi.moneda, -vi.diff)}`, 'err');
  const v = Ventas.buildVenta(false);
  v.numero = ++S.db.contadorVentas;
  P.cart.forEach(ci => {
    const p = Calc.prod(ci.pid);
    p.stock = rq(p.stock - ci.cant);
    S.db.movimientos.push({ id: uid(), fecha: v.fecha, pid: p.id, nombre: nombreCompleto(p), tipo: 'venta', cant: -ci.cant, unidad: p.unidad, nota: 'Venta #' + pad6(v.numero) });
  });
  delete v.simulada;
  S.db.ventas.push(v);
  Storage.save();
  Ventas.resetCart();
  App.render();
  Ticket.openModal(v, { title: 'Venta registrada', exito: true });
  App.recordarRespaldo();
};


/* historial.js — Ventas y movimientos por día / semana / mes / año */

const hayBsGan = arr => arr.some(v => v.tasa > 0);

const Historial = {
  datos() {
    const H = S.hist, r = rangoPeriodo(H.per, H.ref);
    const todas = S.db.ventas.filter(v => { const d = new Date(v.fecha); return d >= r.from && d < r.to; })
      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    const validas = todas.filter(v => !v.anulada);
    return { r, todas, validas };
  },

  render(root) {
    const H = S.hist, { r, todas, validas } = this.datos();
    const total = Calc.sum(validas, 'total'), totalBs = Calc.sum(validas, 'totalBs');
    const hayBs = validas.some(v => v.tasa > 0);
    const imp = Calc.sum(validas, 'impuesto');

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Historial</h1><p class="sub">Revisa lo que vendiste y cómo se movió tu inventario</p></div>
        <div class="head-actions">
          <button class="btn btn-soft" data-action="hist-cierre" ${validas.length ? '' : 'disabled'}>${icon('receipt')}<span>Cierre ${{ dia: 'del día', semana: 'de la semana', mes: 'del mes', ano: 'del año' }[H.per]}</span></button>
          <button class="btn" data-action="hist-pdf" ${validas.length ? '' : 'disabled'}>${icon('pdf')}<span>PDF</span></button>
          <button class="btn" data-action="hist-csv" ${todas.length ? '' : 'disabled'}>${icon('download')}<span>Excel</span></button>
        </div>
      </div>

      <div class="period-bar">
        <div class="seg">${Object.entries(PERIODOS).map(([k, l]) => `<button class="${H.per === k ? 'on' : ''}" data-action="hist-per" data-per="${k}">${l}</button>`).join('')}</div>
        <div class="period-nav">
          <button class="icon-btn" data-action="hist-prev" aria-label="Anterior">${icon('chevL')}</button>
          <button class="btn btn-ghost label" data-action="hist-fecha" title="Elegir fecha">${icon('calendar')}${esc(r.label)}</button>
          <input type="date" id="hist-date" value="${toInputDate(H.ref)}" data-change="hist-date">
          <button class="icon-btn" data-action="hist-next" aria-label="Siguiente">${icon('chevR')}</button>
          <button class="btn btn-sm" data-action="hist-hoy">Hoy</button>
        </div>
      </div>

      ${(() => {
        const cfg = S.db.config, conGan = validas.filter(v => v.ganancia != null), gan = Calc.sum(conGan, 'ganancia');
        const cuarta = cfg.costoActivo
          ? `<div class="card stat"><div class="lab">${icon('dollar')}Ganancia</div><div class="val" style="color:${gan < 0 ? 'var(--danger)' : 'var(--ok)'}">${usd(gan)}</div><div class="sec">${hayBsGan(conGan) ? bs(Calc.sum(conGan.map(v => ({ g: v.tasa > 0 ? round2(v.ganancia * v.tasa) : 0 })), 'g')) + ' · ' : ''}${conGan.length < validas.length ? 'solo productos con costo' : 'estimada'}</div></div>`
          : (cfg.impuestoActivo ? `<div class="card stat"><div class="lab">${icon('dollar')}${esc(cfg.impuestoNombre || 'Impuesto')}</div><div class="val">${usd(imp)}</div><div class="sec">cobrado en el periodo</div></div>` : '');
        return `<div class="grid ${cuarta ? 'cols-4' : 'cols-3'}" style="margin-bottom:16px">
        <div class="card stat accent"><div class="lab">${icon('cash')}Vendido</div><div class="val">${usd(total)}</div><div class="sec">${hayBs ? bs(totalBs) : 'En dólares'}</div></div>
        <div class="card stat"><div class="lab">${icon('receipt')}Ventas</div><div class="val">${validas.length}</div><div class="sec">${todas.length - validas.length ? (todas.length - validas.length) + ' anulada(s)' : 'Sin anuladas'}</div></div>
        <div class="card stat"><div class="lab">${icon('tag')}Promedio</div><div class="val">${usd(validas.length ? total / validas.length : 0)}</div><div class="sec">por venta</div></div>
        ${cuarta}
      </div>`;
      })()}

      <div class="seg" style="margin-bottom:14px">
        <button class="${H.tab === 'ventas' ? 'on' : ''}" data-action="hist-tab" data-tab="ventas">Ventas</button>
        <button class="${H.tab === 'movs' ? 'on' : ''}" data-action="hist-tab" data-tab="movs">Movimientos de inventario</button>
      </div>
      <div id="hist-body"></div>`;
    this.body();
  },

  desglose(validas, r) {
    const per = S.hist.per;
    if (per === 'dia') return '';
    let data = [];
    if (per === 'ano') {
      for (let m = 0; m < 12; m++) {
        const a = new Date(r.from.getFullYear(), m, 1), b = new Date(r.from.getFullYear(), m + 1, 1);
        const t = Calc.sum(validas.filter(v => { const d = new Date(v.fecha); return d >= a && d < b; }), 'total');
        data.push({ label: MES3[m], value: t, title: `${cap(MESES[m])}: ${usd(t)}` });
      }
    } else {
      for (let d = new Date(r.from); d < r.to; d = addDays(d, 1)) {
        const a = d, b = addDays(d, 1);
        const t = Calc.sum(validas.filter(v => { const x = new Date(v.fecha); return x >= a && x < b; }), 'total');
        data.push({ label: per === 'semana' ? `${DIA3[a.getDay()]} ${a.getDate()}` : String(a.getDate()), value: t, title: `${fmtDate(a)}: ${usd(t)}` });
      }
    }
    if (!data.some(d => d.value > 0)) return '';
    return `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>${per === 'ano' ? 'Ventas por mes' : 'Ventas por día'}</h3></div>${barChart(data, { height: 120 })}</div>`;
  },

  body() {
    const H = S.hist, { r, todas, validas } = this.datos(), box = $('#hist-body');
    if (H.tab === 'movs') return this.movs(box, r);

    // Productos más vendidos
    const mapa = {};
    validas.forEach(v => v.items.forEach(i => {
      const k = nombreCompleto(i);
      mapa[k] = mapa[k] || { nombre: k, usd: 0, cant: 0, ud: i.unidad };
      mapa[k].usd += i.subtotal; mapa[k].cant += i.cant;
    }));
    const top = Object.values(mapa).sort((a, b) => b.usd - a.usd).slice(0, 5);
    const maxTop = top.length ? top[0].usd : 1;

    if (!todas.length) {
      box.innerHTML = `<div class="card empty">${icon('receipt')}<h4>Sin ventas en este periodo</h4><p>Cuando registres ventas aparecerán aquí.</p></div>`;
      return;
    }
    box.innerHTML = `
      ${this.desglose(validas, r)}
      <div class="grid main-side">
        <div>${todas.map(v => this.ventaHtml(v)).join('')}</div>
        <div class="card">
          <div class="card-head"><h3>Más vendidos</h3></div>
          ${top.length ? `<div class="rank">${top.map(t => `<div class="rank-row"><div class="rk-top"><span>${esc(t.nombre)}</span><b>${usd(t.usd)}</b></div><div class="meter"><i style="width:${t.usd / maxTop * 100}%"></i></div></div>`).join('')}</div>` : '<p class="muted">Sin datos.</p>'}
        </div>
      </div>`;
  },

  ventaHtml(v) {
    const d = new Date(v.fecha), p = (n, dec = 0) => fmtNum(n, n % 1 ? 2 : dec);
    return `<details class="sale ${v.anulada ? 'void' : ''}">
      <summary>
        <div class="s-l"><b>Venta #${pad6(v.numero || 0)} ${v.anulada ? '<span class="badge void">Anulada</span>' : ''}</b><small>${fmtDateTime(d)} · ${esc(pagoTxt(v))}${v.cliente ? ' · ' + esc(v.cliente) : ''}</small></div>
        <div class="s-r"><b>${usd(v.total)}</b>${v.tasa > 0 ? `<small>${bs(v.totalBs)}</small>` : ''}</div>
      </summary>
      <div class="sale-body">
        ${v.items.map(i => `<div class="line"><div>${esc(nombreCompleto(i))}<small>${fmtQty(i.cantShow ?? i.cant)} ${uShort(i.ud || i.unidad)} × ${usd(i.precio)}/${uShort(i.unidad)}</small></div><b>${usd(i.subtotal)}</b></div>`).join('')}
        <div class="sale-sum">
          <div><span>Subtotal</span><span>${usd(v.subtotal)}</span></div>
          ${v.descuento > 0 ? `<div><span>Descuento (${p(v.descPct)}%)</span><span>-${usd(v.descuento)}</span></div>` : ''}
          ${v.impuesto > 0 ? `<div><span>${esc(v.impNombre || 'Impuesto')} (${p(v.impPct)}%)</span><span>${usd(v.impuesto)}</span></div>` : ''}
          <div class="t"><span>Total</span><span>${usd(v.total)}</span></div>
          ${v.tasa > 0 ? `<div class="t"><span>Total Bs (tasa ${fmtNum(v.tasa)})</span><span>${bs(v.totalBs)}</span></div>` : ''}
          ${v.ganancia != null && S.db.config.costoActivo ? `<div><span>Ganancia de esta venta</span><span style="color:${v.ganancia < 0 ? 'var(--danger)' : 'var(--ok)'}">${usd(v.ganancia)}</span></div>` : ''}
          ${v.recibido > 0 ? `<div><span>Recibido ${fmtM(v.recMoneda, v.recibido)}</span><span>Vuelto ${fmtM(v.recMoneda, v.vuelto)}</span></div>` : ''}
        </div>
        <div class="sale-actions">
          <button class="btn btn-sm btn-soft" data-action="sale-ticket" data-id="${v.id}">${icon('receipt')}Ver ticket</button>
          ${v.anulada ? '' : `<button class="btn btn-sm" data-action="sale-anular" data-id="${v.id}">Anular venta</button>`}
        </div>
      </div></details>`;
  },

  movs(box, r) {
    const ms = S.db.movimientos.filter(m => { const d = new Date(m.fecha); return d >= r.from && d < r.to; })
      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    if (!ms.length) { box.innerHTML = `<div class="card empty">${icon('box')}<h4>Sin movimientos en este periodo</h4></div>`; return; }
    const tipos = { entrada: ['Entrada', 'ok'], salida: ['Salida', 'low'], venta: ['Venta', ''], ajuste: ['Ajuste', ''], anulacion: ['Anulación', 'ok'] };
    box.innerHTML = `<div class="card">${ms.map(m => {
      const [lab, cls] = tipos[m.tipo] || [m.tipo, ''];
      return `<div class="mov"><div class="m-main"><b>${esc(m.nombre)}</b><small>${fmtDateTime(new Date(m.fecha))}${m.nota ? ' · ' + esc(m.nota) : ''}</small></div>
        <span class="badge ${cls}">${lab}</span>
        <div class="m-q ${m.cant >= 0 ? 'pos' : 'neg'}">${m.cant >= 0 ? '+' : ''}${fmtQty(m.cant)} ${uShort(m.unidad)}</div></div>`;
    }).join('')}</div>`;
  }
};

const histRefresh = () => Historial.render($('#view'));
Actions['hist-per'] = t => { S.hist.per = t.dataset.per; histRefresh(); };
Actions['hist-tab'] = t => { S.hist.tab = t.dataset.tab; histRefresh(); };
Actions['hist-prev'] = () => { S.hist.ref = shiftPeriodo(S.hist.per, S.hist.ref, -1); histRefresh(); };
Actions['hist-next'] = () => { S.hist.ref = shiftPeriodo(S.hist.per, S.hist.ref, 1); histRefresh(); };
Actions['hist-hoy'] = () => { S.hist.ref = new Date(); histRefresh(); };
Actions['hist-fecha'] = () => { const i = $('#hist-date'); try { i.showPicker(); } catch (e) { i.focus(); i.click(); } };
Changes['hist-date'] = t => { if (t.value) { S.hist.ref = fromInputDate(t.value); histRefresh(); } };

Actions['hist-cierre'] = conAviso(() => Reportes.cierrePDF(S.hist.per, S.hist.ref));
Actions['hist-pdf'] = conAviso(() => { const { r, validas } = Historial.datos(); return Reportes.ventasPDF(validas, r.label); });
Actions['hist-csv'] = conAviso(() => { const { r, todas } = Historial.datos(); return Reportes.ventasExcel(todas, r.label); });

Actions['sale-ticket'] = t => {
  const v = S.db.ventas.find(x => x.id === t.dataset.id);
  if (v) Ticket.openModal(v, { title: 'Venta #' + pad6(v.numero || 0) });
};
Actions['sale-anular'] = async t => {
  const v = S.db.ventas.find(x => x.id === t.dataset.id); if (!v) return;
  const ok = await confirmDialog({ title: 'Anular venta', msg: `Se anulará la venta #${pad6(v.numero || 0)} y la mercancía <b>volverá al inventario</b>. ¿Continuar?`, ok: 'Anular venta', danger: true });
  if (!ok) return;
  v.anulada = true;
  v.items.forEach(i => {
    const p = Calc.prod(i.pid);
    if (p) p.stock = rq(p.stock + i.cant);
    S.db.movimientos.push({ id: uid(), fecha: new Date().toISOString(), pid: i.pid, nombre: nombreCompleto(i), tipo: 'anulacion', cant: i.cant, unidad: i.unidad, nota: 'Anulación venta #' + pad6(v.numero || 0) });
  });
  Storage.save(); histRefresh(); toast('Venta anulada y stock devuelto');
};

function tiempoRelativo(iso) {
  if (!iso) return 'nunca';
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'hace un momento';
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.floor(h / 24);
  return d === 1 ? 'ayer' : `hace ${d} días`;
}

              <b>Android (Chrome):</b> menú ⋮ → «Instalar app» o «Agregar a la pantalla de inicio».<br>
              <b>iPhone (Safari):</b> botón Compartir → «Agregar a inicio».<br>
              ${window.isSecureContext ? '' : 'Para que aparezca la opción de instalar, el sistema debe abrirse desde una dirección https (publicada) y no desde un archivo o una red local.'}</div>`}

          <div class="card"><div class="card-head"><h3>Tus datos</h3></div><div class="stack">
            <div>
              <div class="kv"><span>Dónde se guardan</span><b>${modoArchivo ? 'Archivo en tu equipo' : 'Este dispositivo'}</b></div>
              ${modoArchivo ? `<div class="kv"><span>Archivo</span><b>${esc(Storage.fileName)}</b></div>` : `<div class="kv"><span>Último respaldo</span><b>${tiempoRelativo(c.ultimoRespaldo)}</b></div>`}
              <div class="kv"><span>Productos / Ventas</span><b>${S.db.productos.length} / ${S.db.ventas.length}</b></div>
            </div>
            <p class="muted-p">${modoArchivo
              ? 'Cada cambio se guarda solo dentro de ese archivo. Puedes copiarlo a un pendrive cuando quieras.'
              : 'En este navegador el archivo no se puede actualizar solo. Pulsa «Guardar respaldo» con frecuencia: se guarda un archivo .json en Descargas/Documentos que puedes volver a abrir.'}</p>
            <div class="row-actions">
              <button class="btn btn-primary" data-action="cfg-respaldo">${icon('save')}Guardar respaldo</button>
              <button class="btn" data-action="cfg-importar">${icon('folder')}Abrir archivo…</button>
              ${Storage.supportsFile ? `<button class="btn" data-action="cfg-crear-archivo">Crear archivo nuevo</button>` : ''}
            </div>
            <input type="file" id="aj-import" accept=".json,application/json" hidden data-change="cfg-import-file">
            <div><button class="btn btn-sm btn-ghost" style="color:var(--danger)" data-action="cfg-borrar">${icon('trash')}Borrar todos los datos</button></div>
          </div></div>
        </div>
      </div>`;
  }
};

/* ----- Texto / números / interruptores genéricos ----- */
Inputs['cfg-text'] = t => { S.db.config[t.dataset.k] = t.value; Storage.save(); App.refreshChrome(); };
Inputs['cfg-num'] = t => { const v = num(t.value); S.db.config[t.dataset.k] = isNaN(v) || v < 0 ? 0 : v; Storage.save(); };
Changes['cfg-bool'] = t => { S.db.config[t.dataset.k] = t.checked; Storage.save(); if (t.dataset.k === 'vueltoActivo') S.pos.recibido = 0; };
Inputs['cfg-negocio'] = t => {
  S.db.config.negocio = t.value.trim() || 'Mi Bodega';
  Storage.save(); App.refreshChrome();
  const l = $('#aj-logo'); if (l && !S.db.config.logo) l.textContent = (S.db.config.negocio[0] || 'B').toUpperCase();
};

/* ----- Color y tema ----- */
Actions['cfg-preset'] = t => { S.db.config.color = t.dataset.c; Storage.save(); App.applyTheme(); Ajustes.render($('#view')); };
Inputs['cfg-color'] = t => { S.db.config.color = t.value; Storage.save(); App.applyTheme(); };
Actions['cfg-tema'] = t => { S.db.config.tema = t.dataset.t; Storage.save(); App.applyTheme(); Ajustes.render($('#view')); };

/* ----- Logo ----- */
Changes['cfg-logo'] = t => {
  const file = t.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 320 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      S.db.config.logo = cv.toDataURL('image/jpeg', 0.88);
      Storage.save(); App.refreshChrome(); Ajustes.render($('#view')); toast('Logo actualizado');
    };
    img.onerror = () => toast('No se pudo leer la imagen', 'err');
    img.src = rd.result;
  };
  rd.readAsDataURL(file); t.value = '';
};
Actions['cfg-logo-quitar'] = () => { S.db.config.logo = ''; Storage.save(); App.refreshChrome(); Ajustes.render($('#view')); };

/* ----- Tasa del dólar ----- */
function guardarTasa(v) {
  if (isNaN(v) || v <= 0) return toast('Escribe una tasa válida (mayor a 0)', 'err'), false;
  S.db.config.tasa = round2(v);
  S.db.config.tasaFecha = new Date().toISOString();
  Storage.save(); App.render(); App.refreshChrome();
  toast('Tasa actualizada: 1 USD = ' + bs(S.db.config.tasa));
  return true;
}
Actions['cfg-tasa'] = () => guardarTasa(num($('#aj-tasa').value));
Actions['edit-tasa'] = () => {
  const c = S.db.config;
  openModal({
    title: 'Tasa del dólar',
    html: `<div class="form"><p class="muted-p">¿A cuántos bolívares está hoy 1 dólar?</p>
      <div class="field"><label>1 USD = Bs</label><input class="input" id="tasa-modal" type="number" inputmode="decimal" step="any" min="0" value="${c.tasa || ''}" placeholder="Ej: 36,50" autofocus></div>
      ${c.tasaFecha ? `<div class="hint">Última actualización: ${fmtDateTime(new Date(c.tasaFecha))}</div>` : ''}</div>`,
    footer: `<button class="btn" data-modal-close>Cancelar</button><button class="btn btn-primary" data-submit data-action="tasa-ok">${icon('check')}Guardar</button>`
  });
};
Actions['tasa-ok'] = () => { if (guardarTasa(num($('#tasa-modal').value))) closeTopModal(); };

/* ----- Categorías ----- */
Actions['cat-add'] = () => {
  const i = $('#cat-new'), v = i.value.trim();
  if (!v) return;
  if (S.db.categorias.some(c => norm(c) === norm(v))) return toast('Esa categoría ya existe', 'err');
  S.db.categorias.push(v); Storage.save(); Ajustes.render($('#view'));
};
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-submit-cat]')) { e.preventDefault(); Actions['cat-add'](); } });
Actions['cat-del'] = t => { S.db.categorias.splice(+t.dataset.i, 1); Storage.save(); Ajustes.render($('#view')); };

/* ----- Datos: respaldo, importar, crear archivo, borrar ----- */
Actions['cfg-respaldo'] = () => { Storage.exportBackup(); setTimeout(() => App.refreshChrome(), 300); };

async function cargarDB(db, aviso) {
  S.db = db; App.applyTheme();
  await Storage.saveNow();
  App.render(); App.refreshChrome();
  toast(aviso);
}
Actions['cfg-importar'] = async () => {
  if (Storage.supportsFile) {
    if (!await confirmDialog({ title: 'Abrir otro archivo', msg: 'Se cargarán los datos del archivo que elijas y el sistema empezará a guardar en él.', ok: 'Elegir archivo' })) return;
    try { await cargarDB(await Storage.openFile(), 'Archivo abierto correctamente'); }
    catch (e) { if (e.name !== 'AbortError') toast('No se pudo abrir el archivo', 'err'); }
  } else $('#aj-import').click();
};
Changes['cfg-import-file'] = async t => {
  const f = t.files[0]; if (!f) return;
  try {
    const db = Storage.parseText(await f.text());
    if (!await confirmDialog({ title: 'Reemplazar datos', msg: `Se reemplazarán los datos actuales por los del archivo <b>${esc(f.name)}</b> (${db.productos.length} productos, ${db.ventas.length} ventas).`, ok: 'Reemplazar', danger: true })) { t.value = ''; return; }
    await cargarDB(db, 'Datos cargados correctamente');
  } catch (e) { toast('El archivo no es válido', 'err'); }
  t.value = '';
};
Actions['cfg-crear-archivo'] = async () => {
  try {
    const actual = S.db;
    const db = await Storage.createFile();
    Object.assign(db, { config: { ...actual.config }, categorias: [...actual.categorias], productos: actual.productos, ventas: actual.ventas, movimientos: actual.movimientos, contadorVentas: actual.contadorVentas });
    S.db = db; await Storage.saveNow(); App.render(); App.refreshChrome();
    toast('Archivo creado: ' + Storage.fileName);
  } catch (e) { if (e.name !== 'AbortError') toast('No se pudo crear el archivo', 'err'); }
};
Actions['cfg-borrar'] = () => {
  openModal({
    title: 'Borrar todos los datos',
    html: `<div class="form"><p class="muted-p">Se borrarán <b>todos los productos, ventas e historial</b>. Esta acción no se puede deshacer. Antes de seguir, guarda un respaldo.</p>
      <div class="field"><label>Escribe BORRAR para confirmar</label><input class="input" id="borrar-conf" autocomplete="off" autofocus></div></div>`,
    footer: `<button class="btn" data-modal-close>Cancelar</button><button class="btn btn-danger" data-submit data-action="cfg-borrar-ok">Borrar todo</button>`
  });
};
Actions['cfg-borrar-ok'] = async () => {
  if ($('#borrar-conf').value.trim().toUpperCase() !== 'BORRAR') return toast('Escribe BORRAR para confirmar', 'err');
  const c = S.db.config, nuevo = defaultDB();
  nuevo.config = { ...c };
  S.db = nuevo; Ventas.resetCart();
  await Storage.saveNow(); closeTopModal(); App.render(); toast('Datos borrados');
};


/* app.js — Arranque, navegación, tema y pantalla de bienvenida */

const VIEWS = {
  inicio: { label: 'Inicio', icon: 'home', mod: () => Inicio },
  inventario: { label: 'Inventario', icon: 'box', mod: () => Inventario },
  ventas: { label: 'Vender', icon: 'cart', mod: () => Ventas },
  historial: { label: 'Historial', icon: 'chart', mod: () => Historial },
  ajustes: { label: 'Ajustes', icon: 'settings', mod: () => Ajustes }
};

const App = {
  _recordado: false,

  /* ---------- Tema y color ---------- */
  applyTheme() {
    const c = S.db ? S.db.config : { color: '#0f766e', tema: 'auto' };
    const root = document.documentElement;
    const [r, g, b] = hex01(c.color || '#0f766e');
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    root.style.setProperty('--brand', c.color || '#0f766e');
    root.style.setProperty('--on-brand', lum > 0.6 ? '#10141a' : '#ffffff');
    const dark = c.tema === 'oscuro' || (c.tema !== 'claro' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    const meta = $('meta[name=theme-color]'); if (meta) meta.content = c.color || '#0f766e';
  },

  /* ---------- Estructura principal ---------- */
  launch() {
    App.applyTheme();
    Ventas.resetCart();
    $('#root').innerHTML = `
      <div class="app">
        <aside class="sidebar">
          <div class="brand brand-slot"></div>
          <nav class="nav">${Object.entries(VIEWS).map(([k, v]) => `<a href="#/${k}" class="nav-item" data-view="${k}">${icon(v.icon)}<span>${v.label}</span></a>`).join('')}</nav>
          <div class="side-foot" id="side-foot"></div>
        </aside>
        <div class="main-col">
          <header class="topbar">
            <div class="brand brand-slot"></div>
            <div class="spacer"></div>
            <button class="chip-btn tasa" id="chip-tasa" data-action="edit-tasa"></button>
            <button class="chip-btn" id="chip-save" data-action="save-chip"></button>
          </header>
          <main id="view" class="view"></main>
        </div>
        <nav class="bottom-nav">${Object.entries(VIEWS).map(([k, v]) => `<a href="#/${k}" class="nav-item" data-view="${k}">${icon(v.icon)}<span>${v.label}</span></a>`).join('')}</nav>
      </div>`;
    App.refreshChrome();
    const v = (location.hash.match(/^#\/(\w+)/) || [])[1];
    App.go(VIEWS[v] ? v : 'inicio');
  },

  go(v) {
    S.view = v;
    $$('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.view === v));
    window.scrollTo(0, 0);
    App.render();
  },
  navigate(v) { if (location.hash === '#/' + v) App.go(v); else location.hash = '#/' + v; },
  render() {
    const root = $('#view'); if (!root) return;
    VIEWS[S.view].mod().render(root);
  },

  brandHTML() {
    const c = S.db.config;
    return `<div class="brand-mark">${c.logo ? `<img src="${c.logo}" alt="">` : esc((c.negocio[0] || 'B').toUpperCase())}</div>
      <div class="brand-txt"><strong>${esc(c.negocio)}</strong><small>Inventario y ventas</small></div>`;
  },

  saveChipInfo() {
    const c = S.db.config, st = Storage.status;
    if (Storage.mode === 'file' && Storage.hasHandle) {
      if (st === 'saving') return { cls: '', ic: 'refresh', txt: 'Guardando…' };
      if (st === 'error') return { cls: 'err', ic: 'alert', txt: 'Error al guardar' };
      return { cls: 'ok', ic: 'check', txt: 'Guardado' };
    }
    const hayDatos = S.db.productos.length || S.db.ventas.length;
    const dias = c.ultimoRespaldo ? (Date.now() - new Date(c.ultimoRespaldo)) / 864e5 : Infinity;
    return { cls: hayDatos && dias >= 2 ? 'warn' : '', ic: 'save', txt: c.ultimoRespaldo ? 'Respaldo ' + tiempoRelativo(c.ultimoRespaldo) : 'Guardar respaldo' };
  },

  /** Nombre e ícono de la pestaña / acceso directo: usan el nombre y el logo del negocio */
  setIdentity() {
    const c = S.db.config;
    document.title = c.negocio || 'Sistema de Bodega';
    ['icon', 'apple-touch-icon'].forEach(rel => {
      let l = document.querySelector(`link[rel="${rel}"]`);
      if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
      if (l.dataset.base === undefined) l.dataset.base = l.getAttribute('href') || '';
      if (c.logo) l.href = c.logo; else if (l.dataset.base) l.setAttribute('href', l.dataset.base); else l.removeAttribute('href');
    });
  },

  refreshChrome() {
    if (!$('#chip-tasa')) return;
    App.setIdentity();
    const c = S.db.config;
    $$('.brand-slot').forEach(b => b.innerHTML = App.brandHTML());
    $('#chip-tasa').innerHTML = Calc.hasTasa() ? `${icon('dollar')}<span>1 USD = <b>${bs(c.tasa)}</b></span>` : `${icon('dollar')}<span>Poner tasa</span>`;
    const s = App.saveChipInfo(), chip = $('#chip-save');
    chip.className = 'chip-btn ' + s.cls;
    chip.innerHTML = `${icon(s.ic)}<span class="hide-sm">${esc(s.txt)}</span>`;
    chip.title = s.txt;
    const foot = $('#side-foot');
    if (foot) foot.textContent = Storage.mode === 'file' && Storage.hasHandle ? 'Archivo: ' + Storage.fileName : 'Modo compatible: guarda respaldos';
  },

  recordarRespaldo() {
    if (App._recordado || (Storage.mode === 'file' && Storage.hasHandle)) return;
    const u = S.db.config.ultimoRespaldo;
    if (!u || Date.now() - new Date(u) > 864e5) {
      App._recordado = true;
      setTimeout(() => toast('Recuerda guardar un respaldo (chip de arriba o Ajustes)'), 1200);
    }
  },

  /* ---------- Pantalla de bienvenida ---------- */
  welcome(info) {
    const modoArchivo = Storage.supportsFile;
    let botones;
    if (modoArchivo) {
      botones = `
        ${info.fileName ? `<button class="btn btn-primary btn-lg btn-block" data-action="w-continue">${icon('folder')}Continuar con «${esc(info.fileName)}»</button>` : ''}
        <button class="btn ${info.fileName ? '' : 'btn-primary'} btn-lg btn-block" data-action="w-create">${icon('plus')}Crear archivo de datos nuevo</button>
        <button class="btn btn-lg btn-block" data-action="w-open">${icon('folder')}Abrir un archivo existente</button>
        <button class="link" data-action="w-local">Usar sin archivo (solo en este navegador)</button>`;
    } else {
      botones = `
        <button class="btn btn-primary btn-lg btn-block" data-action="w-local">${icon('check')}Empezar</button>
        <button class="btn btn-lg btn-block" data-action="w-import">${icon('folder')}Abrir un respaldo (.json)</button>`;
    }
    $('#root').innerHTML = `
      <div class="welcome"><div class="card welcome-card">
        <div class="brand-mark">B</div>
        <h1>Sistema de Bodega</h1>
        <p>Inventario, ventas y reportes en un solo lugar.${modoArchivo
          ? ' Tus datos viven en un <b>archivo dentro de tu equipo</b>: no dependen del navegador ni de internet.'
          : ' Funciona sin internet. Guarda respaldos con frecuencia para no perder tu información.'}</p>
        <div class="stack">${botones}</div>
        <input type="file" id="w-file" accept=".json,application/json" hidden data-change="w-file">
        ${modoArchivo ? '' : '<p class="small muted">En este navegador el archivo no se puede actualizar solo. Para guardado automático en archivo usa Chrome o Edge en una computadora.</p>'}
      </div></div>`;
  },

  async entrar(db) {
    S.db = db;
    Storage.save();
    App.launch();
  }
};

/* ----- Acciones de la bienvenida ----- */
const abortado = e => e && (e.name === 'AbortError');
Actions['w-continue'] = async () => {
  try { App.entrar(await Storage.resume()); } catch (e) { if (!abortado(e)) toast('No se pudo abrir el archivo. Elige uno manualmente.', 'err'); }
};
Actions['w-open'] = async () => {
  try { App.entrar(await Storage.openFile()); } catch (e) { if (!abortado(e)) toast('No se pudo abrir el archivo', 'err'); }
};
Actions['w-create'] = async () => {
  try { App.entrar(await Storage.createFile()); } catch (e) { if (!abortado(e)) toast('No se pudo crear el archivo', 'err'); }
};
Actions['w-local'] = async () => App.entrar(await Storage.useLocalOnly());
Actions['w-import'] = () => $('#w-file').click();
Changes['w-file'] = async t => {
  const f = t.files[0]; if (!f) return;
  try { App.entrar(Storage.parseText(await f.text())); } catch (e) { toast('El archivo no es válido', 'err'); }
  t.value = '';
};

Actions['save-chip'] = () => {
  if (Storage.mode === 'file' && Storage.hasHandle) toast('Guardado automático en: ' + Storage.fileName);
  else Storage.exportBackup();
  setTimeout(() => App.refreshChrome(), 300);
};

/* ----- Instalación como app (PWA) ----- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (S.db && S.view === 'ajustes') Ajustes.render($('#view'));
});
window.addEventListener('appinstalled', () => { installEvt = null; toast('App instalada en tu pantalla de inicio'); if (S.db && S.view === 'ajustes') Ajustes.render($('#view')); });
Actions['pwa-install'] = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(() => {});
  installEvt = null;
  if (S.view === 'ajustes') Ajustes.render($('#view'));
};
const esAppInstalada = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// Pide al navegador que NO borre los datos cuando falte espacio
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ----- Arranque ----- */
window.addEventListener('hashchange', () => {
  if (!S.db) return;
  const v = (location.hash.match(/^#\/(\w+)/) || [])[1];
  if (VIEWS[v]) App.go(v);
});
Storage.onStatus(() => { if (S.db) App.refreshChrome(); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => App.applyTheme());

(async function boot() {
  App.applyTheme();
  let r;
  try { r = await Storage.start(); } catch (e) { r = { needsAction: true }; }
  if (r.db) { S.db = r.db; App.launch(); } else App.welcome(r);
})();

</script>
